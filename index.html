/* ============================================================================
   1. MOTOR DE SONIDO SINTETIZADO (WEB AUDIO API - SIN ARCHIVOS EXTERNOS)
   ============================================================================ */
const sfx = (() => {
  let ctx = null;
  const api = { enabled: localStorage.getItem("ruta_habitos_sound") !== "false" };
  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function note(f, t0, d, type, v, f2) {
    const c = getCtx();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + t0;
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.14, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + d + 0.05);
  }
  function seq(list) {
    if (!api.enabled) return;
    try { list.forEach(n => note(...n)); } catch (e) {}
  }
  api.good = () => seq([[523,0,.13,"triangle",.16],[659,.09,.13,"triangle",.16],[784,.18,.13,"triangle",.16],[1047,.27,.32,"triangle",.18]]);
  api.bad = () => seq([[330,0,.2,"sawtooth",.06],[277,.16,.2,"sawtooth",.06],[220,.32,.45,"sawtooth",.06,170]]);
  api.coin = () => seq([[988,0,.08,"square",.06],[1319,.08,.28,"square",.06]]);
  api.levelup = () => seq([[523,0,.11,"triangle",.18],[659,.09,.11,"triangle",.18],[784,.18,.11,"triangle",.18],[1047,.27,.11,"triangle",.18],[784,.38,.09,"triangle",.18],[1047,.46,.11,"triangle",.18],[1319,.56,.5,"triangle",.2]]);
  api.tap = () => seq([[520,0,.1,"sine",.12,880]]);
  api.chime = () => seq([[880,0,.22,"sine",.18],[1109,.18,.22,"sine",.18],[1319,.36,.45,"sine",.18],[880,.95,.22,"sine",.18],[1109,1.13,.22,"sine",.18],[1319,1.31,.5,"sine",.18]]);
  ["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, () => { getCtx(); }, { once: true }));
  return api;
})();

/* ============================================================================
   2. UTILIDADES DE FECHAS, RACHAS Y CONFETI
   ============================================================================ */
function todayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dayDiff(a, b) {
  if (!a || !b) return 0;
  const parse = s => {
    const [y, m, d] = s.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  };
  return Math.round((parse(b) - parse(a)) / 86400000);
}

function getPastDays(count = 7) {
  const days = [];
  const names = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  for (let i = count - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push({
      key: todayKey(d),
      label: i === 0 ? "Hoy" : names[d.getDay()],
      num: d.getDate()
    });
  }
  return days;
}

function launchConfetti() {
  if (typeof window.confetti === "function") {
    window.confetti({ particleCount: 55, spread: 68, origin: { y: 0.65 } });
  }
}

function showToast(msg, tone = "good") {
  const container = document.getElementById("toast-container");
  if (!container) return;
  const el = document.createElement("div");
  const styles = tone === "warn"
    ? "bg-terracotta text-white border-forest-950"
    : tone === "info"
    ? "bg-forest-800 text-parchment-100 border-gold"
    : "bg-parchment-100 text-forest-900 border-gold";
  el.className = `pointer-events-auto px-4 py-3 rounded-2xl border-2 font-fredoka font-bold text-xs sm:text-sm shadow-2xl transition-all duration-300 ${styles}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(() => el.remove(), 300);
  }, 3400);
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function normalizeDailyRollover(st) {
  const today = todayKey();
  const v = st.pet.visit || { last: null, streak: 0, best: 0 };

  if (v.last && v.last !== today) {
    const gap = dayDiff(v.last, today);
    if (gap === 1) {
      st.pet.visit = { last: today, streak: v.streak + 1, best: Math.max(v.best || 0, v.streak + 1) };
    } else if (gap > 1) {
      if ((st.pet.shields || 0) > 0) {
        st.pet.shields -= 1;
        st.pet.visit = { last: today, streak: v.streak + 1, best: Math.max(v.best || 0, v.streak + 1) };
        setTimeout(() => showToast("🛡️ ¡Tu Escudo de Racha protegió tu constancia!", "info"), 800);
      } else {
        st.pet.visit = { last: today, streak: 1, best: v.best || v.streak };
        st.pet.happiness = Math.max(20, (st.pet.happiness ?? 80) - 8);
      }
    }
  } else if (!v.last) {
    st.pet.visit = { last: today, streak: 1, best: 1 };
  }

  st.habits = (st.habits || []).map(h => {
    let next = { ...h };
    if (next.streak && (!next.lastDone || dayDiff(next.lastDone, today) >= 2)) {
      next.streak = 0;
    }
    if (next.type === "daily" && next.done && next.lastDone !== today) {
      next.done = false;
    }
    return next;
  });

  if (!st.water || st.water.date !== today) {
    st.water = { date: today, count: 0, maxEver: st.water?.maxEver || 0 };
  }
  return st;
}

function checkRemindersLoop() {
  if (!state.onboarded) return;
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const today = todayKey(now);
  let triggeredAny = false;

  (state.reminders || []).forEach(rem => {
    if (rem.enabled && rem.time === hhmm && rem.lastFired !== today) {
      rem.lastFired = today;
      triggeredAny = true;
      fireAlarmAlert(rem.title);
    }
  });

  (state.habits || []).forEach(h => {
    if (h.time && h.time === hhmm && !h.done && h.lastReminded !== today) {
      h.lastReminded = today;
      triggeredAny = true;
      fireAlarmAlert(`Hábito pendiente: ${h.title}`);
    }
  });

  if (triggeredAny) {
    saveState();
    render();
  }
}

function fireAlarmAlert(title) {
  sfx.chime();
  triggerPetReaction("good", `⏰ ¡Recordatorio! ${title}`);
  showToast(`⏰ RECORDATORIO: ${title}`, "info");
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("🌿 Ruta de Hábitos: Compañeros", { body: title });
    } catch (e) {}
  }
}

function grantRewards(xpGain, coinGain, hpGain = 4, happyGain = 6) {
  const p = state.pet;
  p.xp += xpGain;
  p.coins += coinGain;
  p.hp = Math.min(100, Math.max(0, p.hp + hpGain));
  p.happiness = Math.min(100, Math.max(0, p.happiness + happyGain));

  let leveled = false;
  while (p.xp >= p.level * 100) {
    p.xp -= p.level * 100;
    p.level += 1;
    leveled = true;
  }
  if (leveled) {
    setTimeout(() => {
      sfx.levelup();
      launchConfetti();
      showToast(`🎉 ¡${p.name} subió al Nivel ${p.level}!`, "good");
    }, 200);
  }
}

window.toggleHabitDone = (id, isPositive = true) => {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  const mult = h.difficulty === "hard" ? 2 : h.difficulty === "medium" ? 1.4 : 1;

  if (isPositive) {
    if (h.type === "daily" && h.done) return;
    const xpGain = Math.round(13 * mult);
    const coinGain = Math.round(8 * mult);
    sfx.good();
    grantRewards(xpGain, coinGain, 5, 7);
    recordActivityToday();
    h.streak = (h.streak || 0) + 1;
    h.lastDone = todayKey();
    if (h.type === "daily") h.done = true;

    const allDailies = state.habits.filter(x => x.type === "daily");
    if (allDailies.length > 0 && allDailies.every(x => x.done) && state.dailyBonusDate !== todayKey()) {
      state.dailyBonusDate = todayKey();
      grantRewards(30, 25, 10, 15);

    } else {
      triggerPetReaction("good", `¡Excelente! +${xpGain} XP y +${coinGain} 🪙`);
    }
    if (h.streak % 5 === 0) launchConfetti();
  } else {
    sfx.bad();
    h.streak = 0;
    state.pet.hp = Math.max(10, state.pet.hp - 10);
    state.pet.happiness = Math.max(10, state.pet.happiness - 12);
    triggerPetReaction("bad", "¡Ánimo! Retomemos el buen hábito 💪");

  saveState();
  render();
};

function computeStats() {
  const bestStreak = Math.max(state.pet.visit?.best || 1, ...(state.habits || []).map(h => h.streak || 0));
  const stats = {
    totalCompleted: state.totalCompleted || 0,
    maxWater: Math.max(state.water?.maxEver || 0, state.water?.count || 0),
    bestStreak,
    quizPassed: !!state.quizPassed,
    ownedCount: (state.pet.owned || []).length,
    level: state.pet.level || 1
  };
  stats.unlockedBadges = BADGES_CATALOGUE.filter(b => b.check(stats)).length;
  return stats;
}

function renderStreakCalendar() {
  const days = getPastDays(7);
  return days.map(d => {
    const count = state.historyMap[d.key] || 0;
    const active = count > 0;
    return `
      <div class="flex flex-col items-center gap-0.5">
        <div class="w-7 h-7 rounded-xl flex items-center justify-center text-xs font-bold border ${
          active ? 'bg-gold text-forest-900 border-forest-900 shadow-sm' : 'bg-forest-900/70 text-parchment-300 border-forest-600'
        }" title="${d.key}: ${count} acciones">
          ${active ? '🔥' : d.num}
        </div>
        <span class="text-[9px] font-bold text-parchment-200">${d.label}</span>
      </div>
    `;
  }).join("");
}

window.answerAcademyQuiz = (idx) => {
  if (ui.quizPicked !== null) return;
  ui.quizPicked = idx;
  if (idx === QUIZ_QUESTIONS[ui.quizIdx].correct) {
    ui.quizScore += 1;
    sfx.good();
  } else {
    sfx.bad();
  }
  render();
};

window.nextAcademyQuiz = () => {
  if (ui.quizIdx + 1 < QUIZ_QUESTIONS.length) {
    ui.quizIdx += 1;
    ui.quizPicked = null;
  } else {
    ui.quizDone = true;
    if (ui.quizScore >= 8) {
      state.quizPassed = true;
      grantRewards(60, 50, 15, 20);
      launchConfetti();
      saveState();
    }
  }
  render();
};

            <label class="block text-xs font-bold text-forest-900 mb-1">Nombre de tu Compañero</label>
            <input type="text" value="${escapeHtml(state.pet.name)}" oninput="state.pet.name=this.value" placeholder="Ej. Broti, Luna, Chispa"
              class="w-full px-3.5 py-2.5 rounded-xl bg-parchment-100 border-2 border-parchment-400 font-bold text-sm focus:outline-none focus:border-forest-800"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-forest-900 mb-1.5">Elige tu Especie (10 disponibles)</label>
          <div class="grid grid-cols-5 gap-1.5">
            ${Object.values(SPECIES).map(sp => `
              <button type="button" onclick="state.pet.species='${sp.id}'; sfx.tap(); render();"
                class="p-2 rounded-xl border-2 flex flex-col items-center transition-all ${state.pet.species === sp.id ? 'bg-gold/35 border-forest-900 font-bold scale-105' : 'bg-parchment-100 border-parchment-400'}">
                <span class="text-xl">${sp.icon}</span>
                <span class="text-[10px] text-forest-900">${sp.name}</span>
              </button>
            `).join("")}
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-forest-900 mb-1.5">Color del Bosque</label>
          <div class="flex flex-wrap gap-2">
            ${COLOR_PALETTES.map(c => `
              <button type="button" onclick="state.pet.colorId='${c.id}'; sfx.tap(); render();"
                class="w-8 h-8 rounded-full border-2 transition-transform ${state.pet.colorId === c.id ? 'border-forest-900 scale-115 ring-2 ring-gold' : 'border-white'}"
                style="background-color:${c.primary}" title="${c.name}"></button>
            `).join("")}
          </div>
        </div>

        <button onclick="state.onboarded=true; saveState(); sfx.levelup(); launchConfetti(); render();"
          class="w-full py-3.5 rounded-2xl bg-gold hover:bg-gold-hover text-forest-900 font-fredoka font-bold text-base btn-3d-gold">
          🚀 ¡Comenzar Mi Aventura Saludable!
        </button>
      </div>
    </div>
  `;
}

function render() {
  const root = document.getElementById("app");
  if (!root) return;

  if (!state.onboarded) {
    root.innerHTML = renderOnboarding();
    return;
  }

  const xpNeeded = state.pet.level * 100;
  const xpPct = Math.min(100, Math.round((state.pet.xp / xpNeeded) * 100));
  const waterPct = Math.min(100, Math.round((state.water.count / 8) * 100));
  const activeBg = HABITAT_BACKGROUNDS.find(b => b.id === (state.pet.equipped.bg || "bg_forest")) || HABITAT_BACKGROUNDS[0];
  const pomoMins = String(Math.floor(ui.pomodoro.seconds / 60)).padStart(2, "0");
  const pomoSecs = String(ui.pomodoro.seconds % 60).padStart(2, "0");

  root.innerHTML = `
    <div class="max-w-6xl mx-auto w-full px-3 sm:px-6 py-4 sm:py-6 pb-16 space-y-5">
      <!-- ENCABEZADO CON RACHAS, MONEDAS Y ESCUDOS -->
      <header class="bg-forest-900/95 border-2 border-forest-600 rounded-3xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 text-parchment-100 shadow-lg">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-gold text-forest-900 flex items-center justify-center text-2xl font-bold shadow shrink-0">🌿</div>
          <div>
            <h1 class="font-fredoka font-bold text-lg sm:text-xl leading-none">Ruta de Hábitos: Compañeros</h1>
            <p class="text-xs text-sage-light font-semibold mt-0.5">${escapeHtml(state.studentName)} • Racha: 🔥 <b>${state.pet.visit.streak}d</b> (Récord: ${state.pet.visit.best}d)</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <div class="px-3.5 py-1.5 rounded-2xl bg-forest-800 border border-gold/50 flex items-center gap-2 font-fredoka font-bold text-xs sm:text-sm text-gold">
            <span>🪙 ${state.pet.coins}</span>
            <span class="text-forest-500">|</span>
            <span title="Escudos protectores de racha">🛡️ ${state.pet.shields || 0}</span>
          </div>

          <button onclick="sfx.enabled=!sfx.enabled; localStorage.setItem('ruta_habitos_sound', sfx.enabled); render();" class="p-2 rounded-2xl bg-forest-800 hover:bg-forest-700 border border-forest-600 text-sm" title="Sonido">
            ${sfx.enabled ? '🔊' : '🔇'}
          </button>
        </div>
      </header>

      <!-- PANEL PRINCIPAL: MASCOTA + RACHAS SEMANALES + HIDRATACIÓN + POMODORO -->
      <section class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
        <!-- Tarjeta de Compañero Virtual (5 cols) -->
        <div class="lg:col-span-5 bg-gradient-to-b from-forest-700 to-forest-800 border-4 border-forest-900 rounded-3xl p-4 sm:p-5 text-parchment-100 card-3d flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="font-fredoka font-bold text-xl">${escapeHtml(state.pet.name)}</h2>
                <span class="px-2.5 py-0.5 rounded-full bg-gold text-forest-900 font-fredoka font-bold text-xs">Nivel ${state.pet.level}</span>
              </div>
              <p class="text-xs text-parchment-300">${SPECIES[state.pet.species]?.name} • ${PERSONALITIES[state.pet.personality]?.name}</p>
            </div>
            <span class="text-[11px] bg-forest-900/80 px-2.5 py-1 rounded-xl text-sage-light font-bold">Tócame 💬</span>
          </div>

          <div onclick="petPetInteract(event)" class="my-2.5 py-3 rounded-3xl border-2 border-forest-900/70 flex flex-col items-center justify-center relative overflow-hidden cursor-pointer select-none" style="${activeBg.css}">
            ${ui.petReaction ? `
              <div class="absolute top-2 z-30 bg-parchment-100 text-forest-900 border-2 border-forest-900 px-3 py-1 rounded-2xl text-xs font-fredoka font-bold shadow-lg max-w-[220px] text-center animate-bounce">
                ${escapeHtml(ui.petReaction.msg)}
              </div>
            ` : ''}
            ${renderPetSVG(state.pet, 0.92)}
          </div>

          <div class="space-y-2 text-xs font-bold">
            <div>
              <div class="flex justify-between mb-0.5 text-gold-light">
                <span>⭐ Experiencia (XP)</span>
                <span>${state.pet.xp} / ${xpNeeded}</span>
              </div>
              <div class="w-full h-2.5 bg-forest-900 rounded-full overflow-hidden">
                <div class="h-full bg-gold transition-all duration-300" style="width:${xpPct}%"></div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <div class="flex justify-between mb-0.5 text-rose-300"><span>❤️ Salud</span><span>${state.pet.hp}%</span></div>
                <div class="w-full h-2 bg-forest-900 rounded-full overflow-hidden"><div class="h-full bg-terracotta transition-all" style="width:${state.pet.hp}%"></div></div>
              </div>
              <div>
                <div class="flex justify-between mb-0.5 text-emerald-300"><span>😊 Ánimo</span><span>${state.pet.happiness}%</span></div>
                <div class="w-full h-2 bg-forest-900 rounded-full overflow-hidden"><div class="h-full bg-sage transition-all" style="width:${state.pet.happiness}%"></div></div>
              </div>
            </div>
          </div>

          <div class="mt-3 pt-3 border-t border-forest-600 flex items-center justify-between gap-2">
            <div>
              <div class="text-[11px] font-bold text-gold-light">🔥 Racha de Constancia</div>
              <div class="text-[10px] text-parchment-300">7 últimos días</div>
            </div>
            <div class="flex gap-1.5">
              ${renderStreakCalendar()}
            </div>
          </div>
        </div>

        <!-- Columna Derecha: Hidratación + Temporizador Enfoque/Respiración (7 cols) -->
        <div class="lg:col-span-7 flex flex-col justify-between gap-4">
          <div class="bg-parchment-200 border-4 border-forest-900 rounded-3xl p-4 card-3d">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <span class="text-2xl">💧</span>
                <div>
                  <h3 class="font-fredoka font-bold text-forest-900 text-base leading-tight">Hidratación Diaria</h3>
                  <p class="text-xs text-forest-600 font-semibold">${state.water.count * 250} ml / 2,000 ml (8 vasos)</p>
                </div>
              </div>
              <span class="px-2.5 py-1 rounded-xl bg-sky-100 text-sky-800 border border-sky-300 font-fredoka font-bold text-xs">${waterPct}%</span>
            </div>
            <div class="w-full h-3.5 bg-parchment-400 rounded-full overflow-hidden border border-forest-800/30 mb-3">
              <div class="h-full bg-gradient-to-r from-sky-400 to-blue-600 transition-all duration-300" style="width:${waterPct}%"></div>
            </div>
            <div class="grid grid-cols-8 gap-1.5 mb-3">
              ${Array.from({ length: 8 }).map((_, idx) => {
                const filled = idx < state.water.count;
                return `<button onclick="${filled ? '' : 'addWaterGlass()'}" class="h-9 rounded-xl border-2 flex items-center justify-center text-sm transition-all ${
                  filled ? 'bg-sky-500 border-sky-700 text-white shadow-sm scale-105' : 'bg-parchment-100 border-parchment-400 text-slate-400 hover:border-sky-400'
                }">${filled ? '💧' : '🥛'}</button>`;
              }).join("")}
            </div>
            <div class="flex gap-2">
              <button onclick="addWaterGlass()" class="flex-1 py-2 px-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-fredoka font-bold text-xs btn-3d">
                ➕ Beber 1 Vaso (+6 XP, +3 🪙)
              </button>
              ${state.water.count > 0 ? `<button onclick="resetWaterToday()" class="py-2 px-3 rounded-xl bg-parchment-300 hover:bg-parchment-400 text-forest-800 font-bold text-xs">Reiniciar</button>` : ''}
            </div>
          </div>

          <div class="bg-parchment-200 border-4 border-forest-900 rounded-3xl p-4 card-3d">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-fredoka font-bold text-forest-900 text-base">⏱️ Zona de Estudio, Pausa Activa y Respiración</h3>
              <span class="text-xs font-bold text-sage-dark bg-sage/20 px-2 py-0.5 rounded-lg">+30 XP Estudio</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5 mb-3">
              <button onclick="setPomoMode('study')" class="py-1.5 px-2 rounded-xl text-xs font-bold font-fredoka border-2 ${ui.pomodoro.mode === 'study' ? 'bg-forest-800 text-parchment-100 border-forest-900' : 'bg-parchment-100 text-forest-800 border-parchment-400'}">📚 Estudio 25m</button>
              <button onclick="setPomoMode('stretch')" class="py-1.5 px-2 rounded-xl text-xs font-bold font-fredoka border-2 ${ui.pomodoro.mode === 'stretch' ? 'bg-forest-800 text-parchment-100 border-forest-900' : 'bg-parchment-100 text-forest-800 border-parchment-400'}">🧘 Estirar 5m</button>
              <button onclick="setPomoMode('breathe')" class="py-1.5 px-2 rounded-xl text-xs font-bold font-fredoka border-2 ${ui.pomodoro.mode === 'breathe' ? 'bg-forest-800 text-parchment-100 border-forest-900' : 'bg-parchment-100 text-forest-800 border-parchment-400'}">🌬️ Calma 4-7-8</button>
            </div>
            ${ui.pomodoro.mode === 'breathe' ? `
              <div class="mb-2 py-2.5 bg-forest-800 rounded-2xl flex flex-col items-center justify-center text-parchment-100">
                <div class="w-12 h-12 rounded-full bg-sage/40 border-4 border-gold flex items-center justify-center animate-breathe mb-1">🌿</div>
                <p class="text-[11px] font-fredoka text-gold-light">Inhala 4s • Mantén 7s • Exhala lento 8s</p>
              </div>
            ` : ''}
            <div class="flex items-center justify-between bg-parchment-100 border-2 border-parchment-400 rounded-2xl p-3">
              <div>
                <div class="font-fredoka font-bold text-2xl text-forest-900 tracking-wider">${pomoMins}:${pomoSecs}</div>
                <p class="text-[11px] text-forest-600">
                  ${ui.pomodoro.mode === 'study' ? '25 min de concentración sin distracciones.' : ui.pomodoro.mode === 'stretch' ? 'Estira cuello, hombros y descansa la vista.' : 'Reduce nervios antes de rendir un examen.'}
                </p>
              </div>
              <div class="flex flex-col gap-1.5">
                <button onclick="togglePomo()" class="px-4 py-2 rounded-xl font-fredoka font-bold text-xs text-white btn-3d ${ui.pomodoro.running ? 'bg-terracotta' : 'bg-sage-dark'}">
                  ${ui.pomodoro.running ? '⏸ Pausar' : '▶ Iniciar'}
                </button>
                <button onclick="setPomoMode('${ui.pomodoro.mode}')" class="px-3 py-1 rounded-lg bg-parchment-300 text-forest-800 font-bold text-[11px]">Reiniciar</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- BARRA DE NAVEGACIÓN PRINCIPAL (5 PESTAÑAS) -->
      <nav class="grid grid-cols-2 sm:grid-cols-5 gap-2 bg-forest-900/90 p-2 rounded-3xl border-2 border-forest-600">
        ${[
          { id: "habits",    label: "✅ Mis Hábitos" },
          { id: "academy",   label: "📚 Academia Salud" },
          { id: "shop",      label: "🛍️ Tienda y Mejoras" },
          { id: "reminders", label: "⏰ Recordatorios" },
          { id: "profile",   label: "🎓 Credencial y Perfil" }
        ].map(t => `
          <button onclick="state.activeTab='${t.id}'; sfx.tap(); render();" class="py-2.5 px-3 rounded-2xl font-fredoka font-bold text-xs sm:text-sm transition-all ${
            state.activeTab === t.id ? 'bg-gold text-forest-900 shadow-md scale-[1.02]' : 'text-parchment-200 hover:bg-forest-800'
          }">${t.label}</button>
        `).join("")}
      </nav>

      <!-- CONTENIDO DINÁMICO SEGÚN PESTAÑA -->
      ${state.activeTab === "habits" ? `
        <section class="space-y-5">
          <div class="bg-parchment-200 border-4 border-forest-900 rounded-3xl p-4 sm:p-5 card-3d space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h3 class="font-fredoka font-bold text-lg sm:text-xl text-forest-900">🗺️ Tu Ruta Diaria de Hábitos</h3>
              <button type="button" onclick="ui.showPresets=!ui.showPresets; render();" class="px-3.5 py-2 rounded-xl bg-forest-800 hover:bg-forest-700 text-gold font-fredoka font-bold text-xs btn-3d">
                ${ui.showPresets ? '✖ Cerrar Sugeridos' : '✨ Ver Retos Escolares Listos'}
              </button>
            </div>

            ${ui.showPresets ? `
              <div class="bg-parchment-100 border-2 border-forest-700 rounded-2xl p-4 space-y-3">
                <p class="text-xs font-bold text-forest-800">Pulsa "+ Añadir" para sumar hábitos recomendados a tu lista:</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                  ${PRESET_HEALTH_CHALLENGES.map((pr, idx) => `
                    <div class="p-3 rounded-xl bg-parchment-200 border border-parchment-400 flex items-center justify-between gap-2">
                      <div>
                        <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-forest-800 text-parchment-100">${pr.category}</span>
                        <div class="font-fredoka font-bold text-sm text-forest-900 mt-1">${pr.title}</div>
                      </div>
                      <button onclick="addPresetHabit(${idx})" class="px-3 py-1.5 rounded-xl bg-sage-dark hover:bg-sage text-white font-fredoka font-bold text-xs shrink-0 btn-3d-sage">+ Añadir</button>
                    </div>
                  `).join("")}
                </div>
              </div>
            ` : ''}

            <form onsubmit="createNewHabit(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
              <input id="nh-title" type="text" required placeholder="Nuevo hábito saludable (ej. Comer 1 fruta en el recreo)..." class="sm:col-span-4 px-3.5 py-2.5 rounded-xl bg-parchment-100 border-2 border-parchment-400 font-semibold text-sm focus:outline-none focus:border-forest-800"/>
              <select id="nh-cat" class="sm:col-span-2 px-2.5 py-2.5 rounded-xl bg-parchment-100 border-2 border-parchment-400 font-bold text-xs text-forest-900">
                <option value="💧 Hidratación">💧 Hidratación</option>
                <option value="🥗 Nutrición">🥗 Nutrición</option>
                <option value="🌙 Sueño">🌙 Sueño</option>
                <option value="🏃 Movimiento">🏃 Movimiento</option>
                <option value="🪑 Ergonomía">🪑 Ergonomía</option>
                <option value="🧠 Salud Mental">🧠 Salud Mental</option>
                <option value="📵 Bienestar Digital">📵 Digital</option>
              </select>
              <select id="nh-type" class="sm:col-span-2 px-2.5 py-2.5 rounded-xl bg-parchment-100 border-2 border-parchment-400 font-bold text-xs text-forest-900">
                <option value="daily">📅 Diario (1x día)</option>
                <option value="habit">🔄 Repetible (+)</option>
              </select>
              <select id="nh-diff" class="sm:col-span-2 px-2.5 py-2.5 rounded-xl bg-parchment-100 border-2 border-parchment-400 font-bold text-xs text-forest-900">
                <option value="easy">⭐ Fácil (+14 XP)</option>
                <option value="medium" selected>⭐⭐ Media (+18 XP)</option>
                <option value="hard">⭐⭐⭐ Difícil (+25 XP)</option>
              </select>
              <input id="nh-time" type="time" title="Hora de recordatorio opcional" class="sm:col-span-1 px-2 py-2.5 rounded-xl bg-parchment-100 border-2 border-parchment-400 font-bold text-xs text-forest-900"/>
              <button type="submit" class="sm:col-span-1 py-2.5 px-3 rounded-xl bg-gold hover:bg-gold-hover text-forest-900 font-fredoka font-bold text-sm btn-3d-gold" title="Crear hábito">➕</button>
            </form>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${state.habits.map(h => `
              <div class="p-4 rounded-3xl border-4 transition-all flex items-center justify-between gap-3 card-3d ${
                h.done ? 'bg-emerald-50 border-sage-dark opacity-85' : 'bg-parchment-200 border-forest-900'
              }">
                <div class="flex items-center gap-3 min-w-0">
                  <button onclick="toggleHabitDone('${h.id}', true)" ${h.done ? 'disabled' : ''} class="w-12 h-12 rounded-2xl border-2 flex items-center justify-center text-xl font-bold shrink-0 ${
                    h.done ? 'bg-sage text-white border-sage-dark' : 'bg-gold hover:bg-gold-hover text-forest-900 border-forest-900 btn-3d-gold'
                  }">
                    ${h.done ? '✓' : '+'}
                  </button>
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
                      <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md bg-forest-800 text-parchment-100">${escapeHtml(h.category || '🌿 Hábito')}</span>
                      <span class="text-[11px] font-bold text-terracotta-dark">🔥 Racha: ${h.streak || 0}</span>
                      ${h.time ? `<span class="text-[10px] font-bold bg-amber-200 text-forest-900 px-1.5 py-0.5 rounded">⏰ ${h.time}</span>` : ''}
                    </div>
                    <h4 class="font-fredoka font-bold text-base leading-snug ${h.done ? 'line-through text-forest-600' : 'text-forest-900'}">${escapeHtml(h.title)}</h4>
                  </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  ${h.negative && !h.done ? `<button onclick="toggleHabitDone('${h.id}', false)" title="Registrar recaída" class="w-9 h-9 rounded-xl bg-terracotta text-white font-bold text-base btn-3d-terracotta">−</button>` : ''}
                  <button onclick="deleteHabit('${h.id}')" title="Eliminar hábito" class="w-9 h-9 rounded-xl bg-parchment-300 hover:bg-rose-200 text-forest-800 text-xs font-bold">🗑️</button>
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      ` : ''}

      ${state.activeTab === "academy" ? renderAcademyTab() : ''}
      ${state.activeTab === "shop" ? renderShopTab() : ''}
      ${state.activeTab === "reminders" ? renderRemindersTab() : ''}
      ${state.activeTab === "profile" ? renderProfileAndCredentialTab() : ''}

      <footer class="text-center text-xs text-parchment-300/80 pt-3">
        🌿 Ruta de Hábitos: Compañeros • Recurso Educativo Interactivo de Salud y Bienestar Escolar
      </footer>
    </div>
  `;
}

Object.defineProperty(window, "state", { get: () => state, set: (v) => { state = v; } });
window.ui = ui;
window.sfx = sfx;
window.render = render;
window.saveState = saveState;
window.showToast = showToast;
window.launchConfetti = launchConfetti;

render();
setTimeout(checkRemindersLoop, 2000);
</script>
</body>
</html>
