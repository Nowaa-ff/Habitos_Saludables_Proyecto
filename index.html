  : JSON.parse(localStorage.getItem('ruta_custom_firebase_cfg') || 'null');

function initFirebase(cfg) {
  if (!cfg || !cfg.apiKey) return false;
  try {
    firebaseApp = initializeApp(cfg);

    db = getFirestore(firebaseApp);

}

/* ============================================================================
   2. MOTOR DE SONIDO SINTETIZADO (WEB AUDIO API - SIN URLs EXTERNAS)
   ============================================================================ */
const sfx = (() => {
  let ctx = null;
  const api = { enabled: localStorage.getItem("ruta_habitos_sound") !== "false" };
  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function note(f, t0, d, type, v, f2) {
    const c = getCtx();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + t0;
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.14, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.05);
  }
  function seq(list) {
    if (!api.enabled) return;
    try { list.forEach(n => note(...n)); } catch (e) {}
  }
  api.good = () => seq([[523,0,.12,"triangle",.16],[659,.08,.12,"triangle",.16],[784,.16,.12,"triangle",.16],[1047,.24,.32,"triangle",.18]]);
  api.bad = () => seq([[330,0,.2,"sawtooth",.07],[277,.16,.2,"sawtooth",.07],[220,.32,.45,"sawtooth",.07,170]]);
  api.coin = () => seq([[988,0,.07,"square",.06],[1319,.07,.25,"square",.06]]);
  api.levelup = () => seq([[523,0,.11,"triangle",.18],[659,.09,.11,"triangle",.18],[784,.18,.11,"triangle",.18],[1047,.27,.11,"triangle",.18],[784,.38,.09,"triangle",.18],[1047,.46,.11,"triangle",.18],[1319,.55,.55,"triangle",.22]]);
  api.tap = () => seq([[520,0,.1,"sine",.13,880]]);
  api.chime = () => seq([[880,0,.22,"sine",.2],[1109,.18,.22,"sine",.2],[1319,.36,.45,"sine",.22],[880,.95,.22,"sine",.2],[1109,1.13,.22,"sine",.2],[1319,1.31,.55,"sine",.22]]);
  ["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, () => getCtx(), { once: true }));
  return api;
})();

function todayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dayDiff(a, b) {
  if (!a || !b) return 0;
  const p = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((p(b) - p(a)) / 864e5);
}

function normalizeAndRefreshState(raw) {
  const base = createDefaultState();
  if (!raw || typeof raw !== "object") return base;
  const s = {
    ...base,
    ...raw,
    pet: { ...base.pet, ...(raw.pet || {}), equipped: { ...base.pet.equipped, ...((raw.pet && raw.pet.equipped) || {}) }, visit: { ...base.pet.visit, ...((raw.pet && raw.pet.visit) || {}) } },
    water: { ...base.water, ...(raw.water || {}) },
    stats: { ...base.stats, ...(raw.stats || {}) }
  };

  const today = todayKey();

  // 1. Verificar agua del día
  if (s.water.date !== today) {
    s.water = { date: today, count: 0 };
  }

  // 2. Verificar racha de visitas y uso de Escudo de Racha
  const v = s.pet.visit;
  if (v.last !== today) {
    const gap = v.last ? dayDiff(v.last, today) : 0;
    if (gap === 1) {
      v.streak = (v.streak || 0) + 1;
      v.best = Math.max(v.best || 0, v.streak);
    } else if (gap === 2 && (s.pet.shields || 0) > 0) {
      // Escudo de racha salva el día perdido
      s.pet.shields -= 1;
      v.streak = (v.streak || 0) + 1;
      v.best = Math.max(v.best || 0, v.streak);
      setTimeout(() => showToast("🛡️ ¡Tu Escudo de Racha protegió tu racha de días seguidos!", "gold"), 800);
    } else if (gap > 1) {
      v.streak = 1;
      s.pet.happiness = Math.max(20, (s.pet.happiness ?? 85) - 8 * Math.min(4, gap - 1));
    } else {
      v.streak = 1;
    }
    v.last = today;
    if (!Array.isArray(v.activeDays)) v.activeDays = [];
    if (!v.activeDays.includes(today)) v.activeDays = [...v.activeDays.slice(-13), today];
  } else {
    if (!Array.isArray(v.activeDays)) v.activeDays = [today];
    if (!v.activeDays.includes(today)) v.activeDays.push(today);
  }

  // 3. Reiniciar hábitos diarios que eran de días anteriores y verificar rachas individuales
  s.habits = (s.habits || []).map(h => {
    let nh = { ...h };
    if (nh.streak && (!nh.lastDone || dayDiff(nh.lastDone, today) >= 2)) {
      nh.streak = 0;
    }
    if (nh.type === "daily" && nh.done && nh.lastDone !== today) {
      nh.done = false;
    }
    return nh;
  });

  return s;
}

function setupAuthListener() {
  if (!auth) return;
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (unsubscribeCloud) { unsubscribeCloud(); unsubscribeCloud = null; }

    if (user && !user.isAnonymous && db) {
      // Actualizar nombre si aún tiene el genérico
      if (user.displayName && (state.studentName === "Explorador/a" || !state.studentName)) {
        state.studentName = user.displayName;
      }
      const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
      try {
        const snap = await getDoc(userDocRef);
        if (snap.exists() && snap.data().payload) {
          const cloudState = normalizeAndRefreshState(JSON.parse(snap.data().payload));
          if ((cloudState.updatedAt || 0) > (state.updatedAt || 0)) {
            state = cloudState;
            localStorage.setItem("ruta_habitos_master_v3", JSON.stringify(state));
          } else {
            saveState(true);
          }
        } else {
          saveState(true);
        }
      } catch (e) {
        console.warn("Lectura inicial nube:", e.message);
      }

      // Escuchar cambios en tiempo real entre dispositivos
      unsubscribeCloud = onSnapshot(userDocRef, (docSnap) => {
        if (docSnap.exists() && docSnap.data().payload) {
          const incoming = JSON.parse(docSnap.data().payload);
          if ((incoming.updatedAt || 0) > (state.updatedAt || 0) + 1500) {
            state = normalizeAndRefreshState(incoming);
            localStorage.setItem("ruta_habitos_master_v3", JSON.stringify(state));
            render();
          }
        }
      }, (err) => console.warn("Snapshot error:", err.message));
    }
    render();
  });
}

let firedRemindersToday = JSON.parse(localStorage.getItem("ruta_fired_reminders") || "{}");

function checkRemindersLoop() {
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const today = todayKey(now);

  // Limpiar registros de días pasados
  if (firedRemindersToday._date !== today) {
    firedRemindersToday = { _date: today };
    localStorage.setItem("ruta_fired_reminders", JSON.stringify(firedRemindersToday));
  }

  // 1. Revisar hábitos con hora asignada
  state.habits.forEach(h => {
    if (h.time && h.time === hhmm && !h.done) {
      const key = `hab_${h.id}_${hhmm}`;
      if (!firedRemindersToday[key]) {
        firedRemindersToday[key] = true;
        localStorage.setItem("ruta_fired_reminders", JSON.stringify(firedRemindersToday));
        triggerAlarmNotification(`⏰ Hora de tu hábito: ${h.title}`, `¡${state.pet.name} te recuerda cumplir tu meta saludable!`);
      }
    }
  });

  // 2. Revisar recordatorios rápidos activos
  (state.quickReminders || []).forEach(qr => {
    if (qr.enabled && qr.time === hhmm) {
      const key = `qr_${qr.id}_${hhmm}`;
      if (!firedRemindersToday[key]) {
        firedRemindersToday[key] = true;
        localStorage.setItem("ruta_fired_reminders", JSON.stringify(firedRemindersToday));
        triggerAlarmNotification(`🔔 Recordatorio Saludable`, qr.label);
      }
    }
  });
}

setInterval(checkRemindersLoop, 15000);

function showToast(text, type = "good", duration = 3500) {
  const container = document.getElementById("toast-container");
  if (!container) return;
  const colors = {
    good: "bg-parchment-100 border-sage-dark text-forest-900",
    gold: "bg-amber-50 border-gold text-forest-950",
    bad:  "bg-rose-50 border-terracotta text-rose-950",
    info: "bg-sky-50 border-sky-600 text-sky-950"
  };
  const el = document.createElement("div");
  el.className = `pointer-events-auto border-2 px-4 py-3 rounded-2xl shadow-xl font-fredoka font-bold text-xs sm:text-sm flex items-center justify-between gap-2 transition-all transform translate-y-2 opacity-0 ${colors[type] || colors.good}`;
  el.innerHTML = `<span>${text}</span>`;
  container.appendChild(el);
  requestAnimationFrame(() => {
    el.classList.remove("translate-y-2", "opacity-0");
  });
  setTimeout(() => {
    el.classList.add("opacity-0", "translate-y-2");
    setTimeout(() => el.remove(), 300);
  }, duration);
}

function grantRewards(xpGain, coinGain, hpGain = 4, happyGain = 6) {
  const p = state.pet;
  p.xp += xpGain;
  p.coins += coinGain;
  p.hp = Math.min(100, Math.max(0, p.hp + hpGain));
  p.happiness = Math.min(100, Math.max(0, p.happiness + happyGain));

  let leveled = false;
  while (p.xp >= p.level * 100) {
    p.xp -= p.level * 100;
    p.level += 1;
    leveled = true;
  }
  if (leveled) {
    setTimeout(() => {
      sfx.levelup();
      launchConfetti();
      showToast(`🎉 ¡${p.name} subió al Nivel ${p.level}!`, "gold", 4500);
    }, 200);
  }
}

  const q = quotes[Math.floor(Math.random() * quotes.length)];
  ui.petReaction = { type: "good", msg: q };

};

window.toggleHabitDone = (id, isPositive = true) => {
  const h = state.habits.find(item => item.id === id);
  if (!h) return;

  const mult = h.difficulty === "hard" ? 1.8 : h.difficulty === "medium" ? 1.3 : 1;

  if (isPositive) {
    if (h.type === "daily" && h.done) return;
    const xp = Math.round(14 * mult);
    const coins = Math.round(8 * mult);
    sfx.good();
    grantRewards(xp, coins, 5, 8);
    state.stats.totalCompleted += 1;
    h.streak = (h.streak || 0) + 1;
    h.lastDone = todayKey();
    if (h.type === "daily") h.done = true;

    ui.petReaction = { type: "good", msg: `¡Genial! +${xp} XP y +${coins} 🪙` };

    // Verificar si completó el 100% de hábitos diarios del día
    const dailies = state.habits.filter(x => x.type === "daily");
    if (dailies.length > 0 && dailies.every(x => x.done) && state.stats.dailyBonusClaimedDate !== todayKey()) {
      state.stats.dailyBonusClaimedDate = todayKey();
      grantRewards(35, 25, 10, 15);
      launchConfetti();
      showToast("🏆 ¡Completaste TODOS tus hábitos diarios! Bono +35 XP y +25 🪙", "gold", 5000);
    } else if (h.streak % 5 === 0) {
      launchConfetti();
      showToast(`🔥 ¡Racha de ${h.streak} días en "${h.title}"!`, "gold");
    }
  } else {
    sfx.bad();
    state.pet.hp = Math.max(10, state.pet.hp - 10);
    state.pet.happiness = Math.max(15, state.pet.happiness - 12);
    h.streak = 0;
    ui.petReaction = { type: "bad", msg: "¡Ánimo! Retomemos el buen camino 💪" };
  }

  saveState();
  render();
  setTimeout(() => { ui.petReaction = null; render(); }, 2500);
};

window.setPomoMode = (mode) => {
  if (ui.pomodoro.intervalId) { clearInterval(ui.pomodoro.intervalId); ui.pomodoro.intervalId = null; }
  ui.pomodoro.running = false;
  ui.pomodoro.mode = mode;
  ui.pomodoro.seconds = mode === "study" ? 25 * 60 : mode === "stretch" ? 5 * 60 : 2 * 60;
  render();
};

window.togglePomo = () => {
  if (ui.pomodoro.running) {
    clearInterval(ui.pomodoro.intervalId);
    ui.pomodoro.intervalId = null;
    ui.pomodoro.running = false;
    render();
    return;
  }
  ui.pomodoro.running = true;
  ui.pomodoro.intervalId = setInterval(() => {
    ui.pomodoro.seconds -= 1;
    if (ui.pomodoro.seconds <= 0) {
      clearInterval(ui.pomodoro.intervalId);
      ui.pomodoro.intervalId = null;
      ui.pomodoro.running = false;
      const xp = ui.pomodoro.mode === "study" ? 30 : 15;
      const coins = ui.pomodoro.mode === "study" ? 18 : 10;
      state.stats.focusSessions += 1;
      grantRewards(xp, coins, 6, 10);
      sfx.chime();
      launchConfetti();
      showToast(`🔔 ¡Sesión completada! Ganaste +${xp} XP y +${coins} 🪙`, "gold", 4500);
      ui.pomodoro.seconds = ui.pomodoro.mode === "study" ? 25 * 60 : ui.pomodoro.mode === "stretch" ? 5 * 60 : 2 * 60;
      saveState();
    }
    render();
  }, 1000);
  render();
};

function renderStreakCalendar() {
  const names = ["D", "L", "M", "X", "J", "V", "S"];
  const activeSet = new Set(state.pet.visit.activeDays || [todayKey()]);
  let html = "";
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = todayKey(d);
    const isToday = i === 0;
    const active = activeSet.has(key);
    html += `
      <div class="flex flex-col items-center gap-1">
        <span class="text-[10px] font-extrabold ${isToday ? 'text-gold' : 'text-parchment-300'}">${names[d.getDay()]}</span>
        <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold border-2 ${
          active
            ? 'bg-gold border-amber-200 text-forest-950 shadow'
            : 'bg-forest-900/70 border-forest-600 text-forest-400'
        }">
          ${active ? '🔥' : d.getDate()}
        </div>
      </div>
    `;
  }
  return html;
}

              <h3 class="font-fredoka font-bold text-lg sm:text-xl text-forest-900">${QUIZ_QUESTIONS[qs.qIndex].q}</h3>
              <div class="space-y-2.5">
                ${QUIZ_QUESTIONS[qs.qIndex].options.map((opt, idx) => {
                  const isCorrect = idx === QUIZ_QUESTIONS[qs.qIndex].correct;
                  const isPicked = idx === qs.selected;
                  let cls = "bg-parchment-100 border-parchment-400 text-forest-900 hover:border-forest-800";
                  if (qs.selected !== null) {
                    if (isCorrect) cls = "bg-emerald-100 border-emerald-600 text-emerald-950 font-bold";
                    else if (isPicked) cls = "bg-rose-100 border-rose-600 text-rose-950";
                    else cls = "bg-parchment-100 border-parchment-300 opacity-60";
                  }
                  return `
                    <button onclick="answerQuiz(${idx})" class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${cls}">
                      <span class="text-sm sm:text-base font-semibold">${String.fromCharCode(65 + idx)}. ${opt}</span>
                      ${qs.selected !== null && isCorrect ? '<span>✅</span>' : ''}

        <div class="bg-parchment-200 border-4 border-forest-900 rounded-3xl p-5 sm:p-7 card-3d space-y-6">

                <span class="text-xs font-extrabold uppercase tracking-wider text-forest-600">${mod.tag}</span>
                <h3 class="font-fredoka font-bold text-xl sm:text-2xl text-forest-900">${mod.title}</h3>
              </div>
            </div>
          </div>

          <p class="text-sm sm:text-base text-forest-900 font-semibold bg-parchment-100 p-4 rounded-2xl border-2 border-parchment-300 leading-relaxed">
            ${mod.summary}
          </p>

          ${mod.hasWaterCalc ? `
            <div class="bg-sky-50 border-2 border-sky-300 rounded-2xl p-4 sm:p-5">
              <h4 class="font-fredoka font-bold text-sky-950 text-base mb-3">🧮 Calculadora Escolar de Hidratación Personal</h4>
              <div class="flex flex-col sm:flex-row items-center gap-4">
                <div class="flex-1 w-full space-y-2">
                  <label class="block text-xs font-bold text-sky-950">Tu peso aproximado: <b>${ui.waterCalc.weight} kg</b></label>
                  <input type="range" min="25" max="115" value="${ui.waterCalc.weight}" oninput="ui.waterCalc.weight=Number(this.value); render();" class="w-full accent-sky-600"/>

                <div class="bg-white border-2 border-sky-400 rounded-2xl p-4 text-center min-w-[200px]">

            ${state.habits.map(h => `
              <div class="p-4 rounded-3xl border-4 transition-all flex items-center justify-between gap-3 card-3d ${
                h.done ? 'bg-emerald-50 border-sage-dark opacity-85' : 'bg-parchment-200 border-forest-900'
              }">
                <div class="flex items-center gap-3 min-w-0">
                  <button onclick="toggleHabitDone('${h.id}', true)" ${h.done ? 'disabled' : ''} class="w-12 h-12 rounded-2xl border-2 flex items-center justify-center text-xl font-bold shrink-0 ${
                    h.done ? 'bg-sage text-white border-sage-dark' : 'bg-gold hover:bg-gold-hover text-forest-900 border-forest-900 btn-3d-gold'
                  }">
                    ${h.done ? '✓' : '+'}
                  </button>
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
                      <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md bg-forest-800 text-parchment-100">${h.category || '🌿 Hábito'}</span>
                      <span class="text-[11px] font-bold text-terracotta-dark">🔥 Racha: ${h.streak || 0}</span>
                      ${h.time ? `<span class="text-[10px] font-bold bg-amber-200 text-forest-900 px-1.5 py-0.5 rounded">⏰ ${h.time}</span>` : ''}
                    </div>
                    <h4 class="font-fredoka font-bold text-base leading-snug ${h.done ? 'line-through text-forest-600' : 'text-forest-900'}">${h.title}</h4>
                  </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  ${h.negative && !h.done ? `<button onclick="toggleHabitDone('${h.id}', false)" title="Registrar recaída" class="w-9 h-9 rounded-xl bg-terracotta text-white font-bold text-base btn-3d-terracotta">−</button>` : ''}
                  <button onclick="deleteHabit('${h.id}')" title="Eliminar hábito" class="w-9 h-9 rounded-xl bg-parchment-300 hover:bg-rose-200 text-forest-800 text-xs font-bold">🗑️</button>
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      ` : ''}

      ${state.activeTab === "academy" ? renderAcademyTab() : ''}
      ${state.activeTab === "shop" ? renderShopTab() : ''}
      ${state.activeTab === "reminders" ? renderRemindersTab() : ''}
      ${state.activeTab === "profile" ? renderProfileAndCredentialTab() : ''}

      <footer class="text-center text-xs text-parchment-300/80 pt-3">
        🌿 Ruta de Hábitos: Compañeros • Recurso Educativo Interactivo de Salud y Bienestar Escolar
      </footer>
    </div>
  `;
}

// Renderizado inicial y verificación de recordatorios al abrir
render();
setTimeout(checkRemindersLoop, 2000);
</script>
</body>
</html>
