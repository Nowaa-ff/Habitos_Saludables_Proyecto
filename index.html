function todayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function lsRaw(k) {
  try { return window.localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

const sfx = (() => {
  let ctx = null;
  const api = { enabled: lsRaw("ruta_habitos_sound") !== "false" };
  function C() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function note(f, t0, d, type, v, f2) {
    const c = C(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + t0;
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.05);
  }
  function seq(list) { if (!api.enabled) return; try { list.forEach((n) => note(...n)); } catch (e) {} }
  api.good = () => seq([[523,0,.12,"triangle",.16],[659,.08,.12,"triangle",.16],[784,.16,.12,"triangle",.16],[1047,.24,.32,"triangle",.18]]);
  api.bad = () => seq([[330,0,.2,"sawtooth",.06],[277,.15,.2,"sawtooth",.06],[220,.3,.45,"sawtooth",.06,170]]);
  api.coin = () => seq([[988,0,.08,"square",.05],[1319,.08,.28,"square",.05]]);
  api.levelup = () => seq([[523,0,.1,"triangle",.18],[659,.08,.1,"triangle",.18],[784,.16,.1,"triangle",.18],[1047,.24,.1,"triangle",.18],[1319,.32,.5,"triangle",.2]]);
  api.tap = () => seq([[500,0,.08,"sine",.12,850]]);
  api.bubble = () => seq([[380,0,.06,"sine",.1,720],[620,.06,.1,"sine",.12,1100]]);
  api.chime = () => seq([[880,0,.2,"sine",.18],[1109,.15,.2,"sine",.18],[1319,.3,.4,"sine",.18]]);
  ["pointerdown", "keydown"].forEach((ev) => window.addEventListener(ev, () => { C(); }, { once: true }));
  return api;
})();

function App() {

  // Quiz State
  const [quizIdx, setQuizIdx] = useState(0);

  const [quizAnswered, setQuizAnswered] = useState(false);
  const [quizScore, setQuizScore] = useState(0);

  // Reminders
  const [reminders, setReminders] = useState(() => {
    const saved = lsRaw("ruta_habitos_reminders");
    return saved ? JSON.parse(saved) : [
      { id: "r1", time: "08:00", title: "🌅 Luz solar matutina + 1 vaso de agua fresca", bio: "Frena la melatonina e inicia el ciclo circadiano de vigilia", active: true },
      { id: "r2", time: "11:30", title: "🧘 Pausa activa: 5 minutos de respiración y estiramiento", bio: "Baja la tensión cervical y estimula la irrigación cerebral", active: true },
      { id: "r3", time: "13:30", title: "🥗 Almuerzo con 50% de vegetales de colores", bio: "Combustible celular estable sin pesadez ni picos de glucosa", active: true },
      { id: "r4", time: "17:00", title: "🍏 Snack inteligente: Fruta o semillas", bio: "Evita la caída de glucosa vespertina y la ansiedad por dulces", active: true },
      { id: "r5", time: "22:00", title: "🌙 Apagar pantallas y preparar 8 horas de sueño", bio: "Permite que la glándula pineal libere melatonina sin interferencia", active: true }
    ];
  });
  const [newRTime, setNewRTime] = useState("09:00");
  const [newRTitle, setNewRTitle] = useState("");
  const [newRBio, setNewRBio] = useState("");

  useEffect(() => { lsSet("ruta_habitos_user", userProfile); }, [userProfile]);
  useEffect(() => { lsSet("ruta_habitos_pet", pet); }, [pet]);
  useEffect(() => { lsSet("ruta_habitos_list", habits); }, [habits]);
  useEffect(() => { lsSet("ruta_habitos_reminders", reminders); }, [reminders]);

  function triggerToast(msg) {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 2800);
  }

  function triggerReaction(type, msg) {
    setPetReaction({ type, msg, id: Date.now() });
    clearTimeout(reactTimer.current);
    reactTimer.current = setTimeout(() => setPetReaction(null), 3200);
  }

  function toggleSound() {
    const v = !soundOn;
    setSoundOn(v);
    sfx.enabled = v;
    lsSet("ruta_habitos_sound", v);
    if (v) sfx.tap();
  }

  function launchConfetti() {
    if (typeof confetti === "function") {
      confetti({ particleCount: 75, spread: 80, origin: { y: 0.6 } });
    }
  }

  // Google Login Flow Simulation
  const handleGoogleLogin = (email, name) => {
    sfx.good();
    const user = {
      name: name || "Estudiante ETec",
      email: email || "n.fischer@alumno.etec.um.edu.ar",
      avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=" + encodeURIComponent(name || "Noa"),
      syncedAt: new Date().toLocaleTimeString()
    };
    setUserProfile(user);
    setShowAuthModal(false);
    launchConfetti();
    triggerToast(`👋 ¡Sesión iniciada como ${user.name}! Progreso sincronizado.`);
  };

  const handleLogout = () => {
    sfx.tap();
    setUserProfile(null);
    triggerToast("Sesión cerrada (tus datos siguen guardados localmente).");
  };

  const handleCompleteHabit = (id, isPositive = true) => {
    const target = habits.find((x) => x.id === id);
    if (isPositive && target && target.type === "daily" && target.done) {
      triggerToast("✅ Ya completaste esta rutina hoy");
      return;
    }

    if (isPositive) {
      launchConfetti();
      const earnedXp = 20;
      const earnedCoins = 15;
      const willLevel = pet.xp + earnedXp >= pet.level * 60;
      const nextStreak = (target?.streak || 0) + 1;

      if (willLevel) {
        sfx.levelup();
        triggerReaction("good", `🎉 ¡Subí a Nivel ${pet.level + 1}!`);
      } else {
        sfx.good();
        const cheers = [
          "¡Tus células te agradecen! 🌟",
          "¡Dopamina buena para tu cerebro! 🧠",
          "¡Excelente hábito cumplido! 💪",
          "¡Qué bien se siente cuidarse! ✨",
          "¡Sos un ejemplo de constancia! 💖"
        ];
        triggerReaction("good", cheers[Math.floor(Math.random() * cheers.length)]);
      }

      setPet((prev) => {
        let newXp = prev.xp + earnedXp;
        let newLevel = prev.level;
        let xpNeeded = newLevel * 60;
        let newHappiness = Math.min(100, prev.happiness + 5);
        if (newXp >= xpNeeded) {
          newLevel += 1;
          newXp -= xpNeeded;
          triggerToast(`🎉 ¡${prev.name} SUBIÓ AL NIVEL ${newLevel}!`);
        } else {
          triggerToast(`+${earnedXp} XP · +${earnedCoins} Monedas 🪙`);
        }
        return {
          ...prev,
          level: newLevel,
          xp: newXp,
          coins: prev.coins + earnedCoins,
          totalDone: (prev.totalDone || 0) + 1,
          history: { ...(prev.history || {}), [todayKey()]: ((prev.history || {})[todayKey()] || 0) + 1 },
          happiness: newHappiness
        };
      });

      setHabits((prev) => prev.map((h) => {
        if (h.id === id) {
          const s = (h.streak || 0) + 1;
          return { ...h, streak: s, best: Math.max(h.best || 0, s), lastDone: todayKey(), done: h.type === "daily" ? true : h.done };
        }
        return h;
      }));
    } else {
      sfx.bad();
      setPet((prev) => ({ ...prev, happiness: Math.max(10, prev.happiness - 10) }));
      triggerToast(`💔 La felicidad de ${pet.name} disminuyó un poco.`);
      triggerReaction("bad", "Ay... no pasa nada, ¡mañana lo hacemos mejor! 🥺");
      setHabits((prev) => prev.map((x) => (x.id === id ? { ...x, streak: 0 } : x)));
    }
  };

  const handleAddCustomTask = () => {
    if (!newTitle.trim()) return;
    setHabits((prev) => [
      ...prev,
      { id: "custom_" + Date.now(), type: newType, title: newTitle.trim(), positive: true, negative: false, streak: 0, done: false, category: "Personalizado", bio: "Hábito elegido por vos para tu salud diaria." }
    ]);
    setNewTitle("");
    sfx.tap();
    triggerToast("✨ Nuevo hábito añadido a tu lista");
  };

  const handleBuyItem = (item) => {
    if (pet.coins < item.price) {
      sfx.bad();
      triggerToast("❌ Monedas insuficientes. ¡Cumplí hábitos o jugá el Quiz!");
      return;
    }
    setPet((prev) => ({
      ...prev,
      coins: prev.coins - item.price,
      inventory: [...prev.inventory, item.id],
      equipped: { ...prev.equipped, [item.slot]: item.id }
    }));
    sfx.coin();
    triggerToast(`🛍️ ¡Compraste y equipaste ${item.name}!`);
  };

  const handleToggleEquip = (item) => {
    sfx.tap();
    setPet((prev) => {
      const isEquipped = prev.equipped[item.slot] === item.id;
      return {
        ...prev,
        equipped: { ...prev.equipped, [item.slot]: isEquipped ? null : item.id }
      };
    });
  };

  const feedPet = () => {
    if (pet.coins < 8) {
      sfx.bad();
      triggerToast("❌ Necesitás 8 monedas para alimentar a tu compañero");
      return;
    }
    if (pet.happiness >= 100) {
      sfx.tap();
      triggerToast(`😋 ${pet.name} ya está en su máxima felicidad`);
      return;
    }
    sfx.good();
    triggerReaction("good", "¡Ñam ñam! Manzanita biológica 🍏");
    setPet((p) => ({ ...p, coins: p.coins - 8, happiness: Math.min(100, p.happiness + 15) }));
    triggerToast(`+15% Felicidad para ${pet.name}`);
  };

  // Calculations for Nutrition Tab
  const metabolicCalc = useMemo(() => {
    // Mifflin-St Jeor Formula
    const bmr = 10 * userWeight + 6.25 * userHeight - 5 * userAge - 161;
    const actMultiplier = { light: 1.2, moderate: 1.45, intense: 1.7 }[userActive] || 1.45;
    const tdee = Math.round(bmr * actMultiplier);

    // Protein: 1.4g per kg
    const proteinGrams = Math.round(userWeight * 1.4);
    // Fats: 0.9g per kg
    const fatGrams = Math.round(userWeight * 0.9);
    // Carbs: remainder of calories / 4
    const carbGrams = Math.max(120, Math.round((tdee - (proteinGrams * 4 + fatGrams * 9)) / 4));
    // Water
    const waterLiters = Math.round((userWeight * 0.035 + (userActive === "intense" ? 0.8 : 0.4)) * 10) / 10;
    // Fiber: ~14g per 1000 kcal
    const fiberGrams = Math.round((tdee / 1000) * 14);

    return { tdee, proteinGrams, fatGrams, carbGrams, waterLiters, fiberGrams };
  }, [userWeight, userHeight, userAge, userActive]);

      sfx.bad();
      triggerToast("❌ No era esa, ¡leé la explicación científica!");
    }
  };

  const nextQuiz = () => {
    sfx.tap();
    setQuizAnswered(false);
    setSelectedOpt(null);
    setQuizIdx((prev) => (prev + 1) % QUIZ_QUESTIONS.length);
  };

  const filteredFaqs = useMemo(() => {
    return BIOLOGY_LIBRARY.filter((faq) => {
      const matchCat = libraryFilter === "all" || faq.category === libraryFilter;
      const matchSearch = librarySearch.trim() === "" ||
        faq.title.toLowerCase().includes(librarySearch.toLowerCase()) ||
        faq.body.toLowerCase().includes(librarySearch.toLowerCase());
      return matchCat && matchSearch;
    });
  }, [libraryFilter, librarySearch]);

    // Google Sign-In Bar & Header

      E("div", { className: "flex flex-col sm:flex-row justify-between items-center gap-4" },
        E("div", { className: "flex items-center gap-3.5" },
          E("span", { className: "text-3xl p-2.5 bg-forest-900/80 rounded-2xl border border-forest-600" }, "🐾"),
          E("div", null,
            E("div", { className: "flex items-center gap-2" },
              E("h1", { className: "font-fredoka text-2xl sm:text-3xl font-bold text-gold tracking-wide" }, "Ruta de Hábitos"),
              E("span", { className: "bg-sage-dark text-parchment-100 text-[10px] font-bold px-2 py-0.5 rounded-full" }, "RPG de Bienestar")

            E("p", { className: "text-xs text-sage-light font-semibold" }, "Salud celular, nutrición y hábitos respaldados por la ciencia")

        E("div", { className: "flex items-center gap-3" },
          userProfile ? E("div", { className: "flex items-center gap-2.5 bg-forest-900/90 px-3 py-1.5 rounded-2xl border border-forest-600" },
            E("img", { src: userProfile.avatar, alt: userProfile.name, className: "w-7 h-7 rounded-full bg-parchment-200 p-0.5" }),

              E("div", { className: "bg-parchment-200 p-3 rounded-xl border border-parchment-300 font-bold text-sage-dark text-[11px]" },
                faq.takeaway
              )
            )
          );
        })
      )
    ),

    // TAB 4: Interactive Biology Quiz (NEW & PLAYFUL!)
    activeTab === "quiz" && E("div", { className: "max-w-2xl mx-auto space-y-6" },
      E("div", { className: "bg-parchment-200 border-2 border-forest-800 p-6 rounded-3xl card-3d space-y-5" },
        E("div", { className: "flex justify-between items-center border-b border-parchment-300 pb-3" },
          E("div", null,
            E("span", { className: "text-[11px] font-bold text-forest-600 uppercase" },
              `Pregunta ${quizIdx + 1} de ${QUIZ_QUESTIONS.length}`
            ),
            E("h2", { className: "font-fredoka text-xl font-bold text-forest-900" },
              "Quiz Biológico: Poné a prueba tus conocimientos"
            )
          ),
          E("div", { className: "text-right" },
            E("span", { className: "bg-gold text-forest-950 px-3 py-1 rounded-xl font-fredoka font-bold text-xs shadow-sm" },
              `Aciertos: ${quizScore}`
            )
          )
        ),

        // Question Title
        E("div", { className: "font-fredoka font-bold text-base text-forest-950 py-1" },
          QUIZ_QUESTIONS[quizIdx].q
        ),

        // Options List
        E("div", { className: "space-y-2.5" },
          QUIZ_QUESTIONS[quizIdx].options.map((opt, i) => {
            const isCorrect = i === QUIZ_QUESTIONS[quizIdx].correct;
            const isChosen = selectedOpt === i;
            let btnClass = "bg-parchment-100 border-parchment-400 text-forest-900 hover:bg-parchment-300";
            if (quizAnswered) {
              if (isCorrect) btnClass = "bg-sage border-sage-dark text-white font-bold";
              else if (isChosen) btnClass = "bg-terracotta border-terracotta-dark text-white font-bold";
              else btnClass = "bg-parchment-100 opacity-50 text-forest-800";
            }
            return E("button", {
              key: i,
              disabled: quizAnswered,
              onClick: () => handleAnswerQuiz(i),
              className: `w-full text-left p-3.5 rounded-2xl border-2 text-xs font-bold transition flex items-center justify-between ${btnClass}`
            },
              E("span", null, opt),
              quizAnswered && isCorrect && E("span", null, "✅"),
              quizAnswered && isChosen && !isCorrect && E("span", null, "❌")
            );
          })
        ),

        // Answer Explanation
        quizAnswered && E("div", { className: "p-4 bg-parchment-100 border-2 border-forest-800 rounded-2xl space-y-2" },
          E("div", { className: "font-fredoka font-bold text-xs " + (selectedOpt === QUIZ_QUESTIONS[quizIdx].correct ? "text-sage-dark" : "text-terracotta") },
            selectedOpt === QUIZ_QUESTIONS[quizIdx].correct ? "🎉 ¡Respuesta Correcta!" : "💡 Explicación Biológica:"
          ),
          E("p", { className: "text-xs text-forest-800 font-semibold leading-relaxed" },
            QUIZ_QUESTIONS[quizIdx].explanation
          ),
          E("div", { className: "pt-2 text-right" },
            E("button", {
              onClick: nextQuiz,
              className: "bg-forest-800 hover:bg-forest-700 text-parchment-100 font-fredoka font-bold text-xs px-5 py-2 rounded-xl btn-3d transition"
            }, quizIdx + 1 < QUIZ_QUESTIONS.length ? "Siguiente Pregunta ➔" : "Reiniciar Quiz 🔄")
          )
        )
      )
    ),

    // TAB 5: Wardrobe & Companion Customization
    activeTab === "wardrobe" && E("div", { className: "grid md:grid-cols-2 gap-6" },
      E("div", { className: "bg-parchment-200 border-2 border-forest-800 p-5 rounded-3xl card-3d space-y-4" },
        E("h3", { className: "font-fredoka font-bold text-forest-900 text-lg border-b-2 border-parchment-400 pb-2" },
          "✏️ Identidad y Especie de tu Compañero"
        ),
        E("div", { className: "grid grid-cols-2 gap-3" },
          E("div", null,
            E("label", { className: "text-xs font-bold text-forest-800" }, "Nombre del Compañero:"),
            E("input", {
              type: "text",
              value: pet.name,
              onChange: (e) => setPet((p) => ({ ...p, name: e.target.value })),
              placeholder: "Elegí su nombre...",
              className: "w-full mt-1 bg-parchment-100 border-2 border-parchment-400 rounded-xl px-3 py-1.5 text-sm font-bold text-forest-900"
            })
          ),
          E("div", null,
            E("label", { className: "text-xs font-bold text-forest-800" }, "Mote / Título de Honor:"),
            E("input", {
              type: "text",
              value: pet.title,
              onChange: (e) => setPet((p) => ({ ...p, title: e.target.value })),
              className: "w-full mt-1 bg-parchment-100 border-2 border-parchment-400 rounded-xl px-3 py-1.5 text-sm font-bold text-forest-900"
            })
          )
        ),
        E("div", null,
          E("label", { className: "text-xs font-bold text-forest-800" }, "Especie Animal (¡Estéticas y tiernas!):"),
          E("div", { className: "grid grid-cols-5 gap-2 mt-1.5" },
            Object.values(SPECIES).map((sp) => E("button", {
              key: sp.id,
              onClick: () => { sfx.tap(); setPet((p) => ({ ...p, species: sp.id })); },
              className: `p-2 rounded-2xl border-2 text-center transition ${pet.species === sp.id ? "bg-forest-800 text-gold border-forest-900 shadow-md scale-105" : "bg-parchment-100 border-parchment-400 hover:bg-parchment-300"}`
            },
              E("div", { className: "text-2xl" }, sp.icon),
              E("div", { className: "text-[10px] font-bold truncate mt-0.5" }, sp.name)
            ))
          )
        ),
        E("div", null,
          E("label", { className: "text-xs font-bold text-forest-800" }, "Personalidad y Frases:"),
          E("div", { className: "grid grid-cols-2 sm:grid-cols-3 gap-2 mt-1" },
            Object.values(PERSONALITIES).map((pers) => E("button", {
              key: pers.id,
              onClick: () => { sfx.tap(); setPet((p) => ({ ...p, personality: pers.id })); },
              className: `p-2 rounded-xl border-2 text-left transition ${pet.personality === pers.id ? "bg-forest-800 text-gold border-forest-900" : "bg-parchment-100 border-parchment-400"}`
            },
              E("div", { className: "font-bold text-xs" }, pers.icon, " ", pers.name)
            ))
          )
        ),
        E("div", null,
          E("label", { className: "text-xs font-bold text-forest-800" }, "Paleta de Color y Pelaje:"),
          E("div", { className: "flex gap-2.5 mt-1.5 overflow-x-auto pb-1" },
            COLOR_PALETTES.map((pal) => E("button", {
              key: pal.id,
              onClick: () => { sfx.tap(); setPet((p) => ({ ...p, colorId: pal.id })); },
              title: pal.name,
              className: `w-9 h-9 rounded-full border-2 transition-transform ${pet.colorId === pal.id ? "scale-110 border-forest-900 ring-2 ring-gold" : "border-parchment-400 hover:scale-105"}`,
              style: { backgroundColor: pal.primary }
            }))
          )
        )
      ),

      E("div", { className: "space-y-4" },
        E("h3", { className: "font-fredoka font-bold text-parchment-100 text-lg" }, "🎒 Objetos en tu Inventario"),
        E("div", { className: "grid grid-cols-2 gap-3" },
          pet.inventory.map((itemId) => {
            const item = EQUIPMENT_CATALOGUE.find((i) => i.id === itemId);
            if (!item) return null;
            const isEquipped = pet.equipped[item.slot] === item.id;
            return E("div", {
              key: item.id,
              className: `bg-parchment-100 border-2 border-forest-800 p-3.5 rounded-2xl flex flex-col justify-between ${isEquipped ? "ring-2 ring-gold bg-parchment-200" : ""}`
            },
              E("div", { className: "flex items-center gap-2.5" },
                E("span", { className: "text-2xl p-1 bg-parchment-300 rounded-xl" }, item.icon),
                E("div", null,
                  E("div", { className: "font-bold text-xs text-forest-900" }, item.name),
                  E("div", { className: "text-[10px] text-forest-600 font-semibold" }, item.desc)
                )
              ),
              E("button", {
                onClick: () => handleToggleEquip(item),
                className: `mt-2.5 w-full py-1.5 rounded-xl font-fredoka font-bold text-xs transition ${isEquipped ? "bg-terracotta text-white" : "bg-gold text-forest-900"}`
              }, isEquipped ? "Desequipar" : "Equipar")
            );
          })
        )
      )
    ),

    // TAB 6: Shop (Expanded with 20+ Aesthetic Items)
    activeTab === "shop" && E("div", { className: "space-y-4" },
      E("div", { className: "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4" },
        EQUIPMENT_CATALOGUE.map((item) => {
          const isOwned = pet.inventory.includes(item.id);
          return E("div", {
            key: item.id,
            className: "bg-parchment-100 border-2 border-forest-800 p-4 rounded-3xl card-3d flex flex-col items-center text-center justify-between"
          },
            E("div", { className: "text-4xl my-2" }, item.icon),
            E("div", { className: "font-bold text-sm text-forest-900" }, item.name),
            E("div", { className: "text-xs text-forest-600 font-medium my-1" }, item.desc),
            isOwned
              ? E("span", { className: "mt-2 text-xs font-bold text-sage bg-sage/20 px-3 py-1 rounded-full border border-sage" }, "✓ En inventario")
              : E("button", {
                onClick: () => handleBuyItem(item),
                className: "mt-2 w-full bg-gold hover:bg-gold-hover text-forest-900 font-fredoka font-bold text-xs py-2 rounded-xl btn-3d-gold transition"
              }, `Comprar 🪙 ${item.price}`)
          );
        })
      )
    ),

    // TAB 7: Reminders (Circadian-based alerts)
    activeTab === "reminders" && E("div", { className: "bg-parchment-200 border-2 border-forest-800 p-6 rounded-3xl card-3d space-y-5" },
      E("div", { className: "flex justify-between items-center" },
        E("h3", { className: "font-fredoka font-bold text-forest-900 text-xl flex items-center gap-2" },
          E("span", null, "🔔"), "Recordatorios con Respaldo Circadiano"
        ),
        E("span", { className: "text-xs font-bold text-forest-700 bg-parchment-100 px-3 py-1 rounded-xl border border-parchment-300" },
          "Avisos sonoros y visuales"
        )
      ),
      E("p", { className: "text-xs font-semibold text-forest-700" },
        "Configurá momentos estratégicos del día para beber agua, moverte y desconectar antes de dormir."
      ),
      E("div", { className: "flex flex-col sm:flex-row gap-3" },
        E("input", {
          type: "time", value: newRTime,
          onChange: (e) => setNewRTime(e.target.value || "09:00"),
          className: "bg-parchment-100 border-2 border-parchment-400 rounded-2xl px-3 py-2 text-sm font-bold text-forest-900"
        }),
        E("input", {
          type: "text", value: newRTitle,
          onChange: (e) => setNewRTitle(e.target.value),
          placeholder: "¿Qué querés recordar? (ej: Tomar 1 vaso de agua)",
          className: "flex-1 bg-parchment-100 border-2 border-parchment-400 rounded-2xl px-4 py-2 text-sm font-bold text-forest-900"
        }),
        E("button", {
          onClick: () => {
            if (!newRTitle.trim()) return;
            setReminders((prev) => [...prev, { id: "r" + Date.now(), time: newRTime, title: newRTitle.trim(), bio: "Hábito programado por el usuario", active: true }].sort((a, b) => a.time.localeCompare(b.time)));
            setNewRTitle("");
            sfx.tap();
            triggerToast("⏰ Recordatorio guardado");
          },
          className: "bg-forest-800 hover:bg-forest-700 text-parchment-100 font-fredoka font-bold px-6 py-2 rounded-2xl btn-3d transition"
        }, "+ Añadir")
      ),
      E("div", { className: "space-y-3" },
        reminders.map((r) => E("div", {
          key: r.id,
          className: "bg-parchment-100 border-2 border-forest-800 p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3"
        },
          E("div", { className: "flex-1" },
            E("div", { className: "flex items-center gap-2" },
              E("span", { className: "font-fredoka font-bold text-gold text-sm bg-forest-800 px-2.5 py-0.5 rounded-lg" }, r.time),
              E("span", { className: "font-bold text-xs text-forest-950" }, r.title)
            ),
            E("p", { className: "text-[11px] text-forest-600 font-semibold mt-1" }, "🔬 ", r.bio)
          ),
          E("div", { className: "flex items-center gap-2 self-end sm:self-center" },
            E("button", {
              onClick: () => { sfx.chime(); triggerToast(`🔔 Alerta de prueba: ${r.title}`); },
              className: "px-3 py-1.5 rounded-xl text-xs font-bold bg-parchment-300 hover:bg-parchment-400 text-forest-900"
            }, "🔊 Probar"),
            E("button", {
              onClick: () => setReminders((prev) => prev.filter((x) => x.id !== r.id)),
              className: "px-3 py-1.5 rounded-xl text-xs font-bold bg-terracotta text-white"
            }, "🗑")
          )
        ))
      )
    ),

    // Discrete Academic Footer
    E("footer", { className: "text-center pt-8 pb-4 text-xs text-parchment-300 font-semibold space-y-1 opacity-80" },
      E("p", null, "Desarrollado con 💚 por estudiantes de 3° Informática · Escuela Técnica de la Universidad de Mendoza (ETec UM)"),
      E("p", { className: "text-[11px] text-sage-light" }, "Noa Fischer · Constanza Smaha · María Villalobos · Paulina Olguin · Amparo Salinas · Clase de Biología (2026)")
    ),

    // Floating Buttons (Feed & Sound)
    E(React.Fragment, null,
      E("button", {
        onClick: feedPet,
        title: "Dar manzana crujiente (8 monedas)",
        className: "fixed bottom-24 right-4 z-40 w-13 h-13 rounded-full bg-forest-800 border-2 border-gold text-2xl btn-3d flex items-center justify-center p-2.5 shadow-2xl"
      }, "🍏"),
      E("button", {
        onClick: toggleSound,
        title: soundOn ? "Silenciar" : "Activar sonido",
        className: "fixed bottom-6 right-4 z-40 w-13 h-13 rounded-full bg-forest-800 border-2 border-gold text-2xl btn-3d flex items-center justify-center p-2.5 shadow-2xl"
      }, soundOn ? "🔊" : "🔇")
    ),

    // Google Auth Modal Simulation
    showAuthModal && E("div", {
      className: "fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm"
    },
      E("div", { className: "bg-parchment-100 border-3 border-forest-800 p-6 rounded-3xl max-w-sm w-full card-3d space-y-4" },
        E("div", { className: "text-center space-y-1" },
          E("div", { className: "w-12 h-12 mx-auto bg-parchment-200 rounded-full flex items-center justify-center text-2xl border border-parchment-400" }, "🔐"),
          E("h3", { className: "font-fredoka font-bold text-xl text-forest-900" }, "Iniciar Sesión con Google"),
          E("p", { className: "text-xs text-forest-600 font-semibold" }, "Guardá tu progreso, niveles de tu mascota y rachas de hábitos.")
        ),
        E("div", { className: "space-y-2 pt-2" },
          E("button", {
            onClick: () => handleGoogleLogin("n.fischer@alumno.etec.um.edu.ar", "Noa Fischer (ETec)"),
            className: "w-full p-3 rounded-2xl border-2 border-forest-800 bg-parchment-50 hover:bg-parchment-200 flex items-center gap-3 text-left transition"
          },
            E("div", { className: "w-8 h-8 rounded-full bg-forest-800 text-gold flex items-center justify-center font-bold text-xs" }, "NF"),
            E("div", { className: "min-w-0 flex-1" },
              E("div", { className: "text-xs font-bold text-forest-900 truncate" }, "Noa Fischer"),
              E("div", { className: "text-[10px] text-forest-600 truncate" }, "n.fischer@alumno.etec.um.edu.ar")
            )
          ),
          E("button", {
            onClick: () => handleGoogleLogin("estudiante@etec.um.edu.ar", "Cuenta Institucional ETec"),
            className: "w-full p-3 rounded-2xl border-2 border-parchment-400 bg-parchment-50 hover:bg-parchment-200 flex items-center gap-3 text-left transition"
          },
            E("div", { className: "w-8 h-8 rounded-full bg-sage-dark text-white flex items-center justify-center font-bold text-xs" }, "UM"),
            E("div", { className: "min-w-0 flex-1" },
              E("div", { className: "text-xs font-bold text-forest-900 truncate" }, "Cuenta Institucional ETec UM"),
              E("div", { className: "text-[10px] text-forest-600 truncate" }, "estudiante@etec.um.edu.ar")
            )
          )
        ),
        E("div", { className: "pt-2 text-center" },
          E("button", {
            onClick: () => setShowAuthModal(false),
            className: "text-xs text-forest-700 hover:text-forest-900 font-bold underline"
          }, "Cancelar")
        )
      )
    ),

    // Toast
    toastMessage && E("div", {
      className: "fixed bottom-6 left-1/2 -translate-x-1/2 bg-forest-950 text-gold px-6 py-3 rounded-2xl font-fredoka font-bold border-2 border-gold shadow-2xl z-50 animate-bounce text-sm text-center"
    }, toastMessage)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(E(App));
</script>
</body>
</html>
