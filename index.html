function todayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayDiff(a, b) {
  const p = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  };
  return Math.round((p(b) - p(a)) / 864e5);
}
function lsRaw(k) {
  try { return window.localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

const sfx = (() => {
  let ctx = null;
  const api = { enabled: lsRaw("ruta_habitos_sound") !== "false" };
  function C() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function note(f, t0, d, type, v, f2) {
    const c = C(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + t0;
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.05);
  }
  function seq(list) { if (!api.enabled) return; try { list.forEach((n) => note(...n)); } catch (e) {} }
  api.good = () => seq([[523,0,.14,"triangle",.18],[659,.09,.14,"triangle",.18],[784,.18,.14,"triangle",.18],[1047,.27,.35,"triangle",.2]]);
  api.bad = () => seq([[330,0,.22,"sawtooth",.07],[277,.17,.22,"sawtooth",.07],[220,.34,.5,"sawtooth",.07,170]]);
  api.coin = () => seq([[988,0,.08,"square",.06],[1319,.08,.3,"square",.06]]);
  api.levelup = () => seq([[523,0,.12,"triangle",.2],[659,.1,.12,"triangle",.2],[784,.2,.12,"triangle",.2],[1047,.3,.12,"triangle",.2],[784,.42,.1,"triangle",.2],[1047,.5,.12,"triangle",.2],[1319,.6,.6,"triangle",.24]]);
  api.tap = () => seq([[500,0,.1,"sine",.14,900]]);
  api.bubble = () => seq([[350,0,.08,"sine",.12,750],[650,.08,.12,"sine",.14,1200]]);
  api.chime = () => seq([[880,0,.25,"sine",.2],[1109,.2,.25,"sine",.2],[1319,.4,.5,"sine",.2],[880,1.1,.25,"sine",.2],[1109,1.3,.25,"sine",.2],[1319,1.5,.6,"sine",.2]]);
  ["pointerdown", "keydown"].forEach((ev) => window.addEventListener(ev, () => { C(); }, { once: true }));
  return api;
})();

  const palette = COLOR_PALETTES.find((p) => p.id === pet.colorId) || COLOR_PALETTES[0];
  const pose = pet.pose || "happy";
  const eq = pet.equipped || {};
  const mood = (reaction && reaction.type) || (pet.happiness < 30 ? "sad" : null);
  const [clickHearts, setClickHearts] = useState([]);
  const [currentQuote, setCurrentQuote] = useState(null);

  const handleAnimalClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const newHeart = { id: Date.now() + Math.random(), x, y };
    setClickHearts((prev) => [...prev.slice(-5), newHeart]);

    const quotes = (PERSONALITIES[pet.personality]?.quotes) || PERSONALITIES.alegre.quotes;
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    setCurrentQuote(q);
    setTimeout(() => setCurrentQuote((c) => (c === q ? null : c)), 3800);
    if (onClick) onClick();
  };

  return E("div", {
    onClick: handleAnimalClick,
    className: "relative cursor-pointer select-none flex flex-col items-center justify-center group transition-transform active:scale-95",
    style: { width: 220 * scale, height: 260 * scale }

  const [activeTab, setActiveTab] = useState("tasks");
  const [toastMessage, setToastMessage] = useState(null);
  const [newTitle, setNewTitle] = useState("");
  const [newType, setNewType] = useState("habit");
  const [petReaction, setPetReaction] = useState(null);
  const reactTimer = useRef(null);
  const [soundOn, setSoundOn] = useState(() => lsRaw("ruta_habitos_sound") !== "false");

  // Nutrition search and filter state
  const [foodSearch, setFoodSearch] = useState("");
  const [foodCategory, setFoodCategory] = useState("all");

  // Water calculator state
  const [userWeight, setUserWeight] = useState(55);
  const [userActive, setUserActive] = useState("moderate");
  const [glassesDrunk, setGlassesDrunk] = useState(() => {
    const s = lsRaw("ruta_habitos_water_" + todayKey());
    return s ? Number(s) : 0;
  });

  // Reminders state
  const [reminders, setReminders] = useState(() => {
    const saved = lsRaw("ruta_habitos_reminders");
    return saved ? JSON.parse(saved) : [
      { id: "r1", time: "08:00", title: "¡Buen día! Tomá un gran vaso de agua y estirá 💧", active: true },
      { id: "r2", time: "13:00", title: "Momento del almuerzo con vegetales de colores 🥗", active: true },
      { id: "r3", time: "22:00", title: "Hora de apagar pantallas y preparar el sueño 🌙", active: true }
    ];
  });
  const [newRTime, setNewRTime] = useState("09:00");
  const [newRTitle, setNewRTitle] = useState("");
  const [alertR, setAlertR] = useState(null);

  useEffect(() => { lsSet("ruta_habitos_pet", pet); }, [pet]);
  useEffect(() => { lsSet("ruta_habitos_list", habits); }, [habits]);
  useEffect(() => { lsSet("ruta_habitos_reminders", reminders); }, [reminders]);
  useEffect(() => { lsSet("ruta_habitos_water_" + todayKey(), glassesDrunk); }, [glassesDrunk]);

  function triggerToast(msg) {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 2800);
  }

  function triggerReaction(type, msg) {
    setPetReaction({ type, msg, id: Date.now() });
    clearTimeout(reactTimer.current);
    reactTimer.current = setTimeout(() => setPetReaction(null), 3000);
  }

  function toggleSound() {
    const v = !soundOn;
    setSoundOn(v);
    sfx.enabled = v;
    lsSet("ruta_habitos_sound", v);
    if (v) sfx.tap();
  }

  function launchConfetti() {
    if (typeof confetti === "function") {
      confetti({ particleCount: 70, spread: 75, origin: { y: 0.6 } });
    }
  }

  const handleCompleteHabit = (id, isPositive = true) => {
    const target = habits.find((x) => x.id === id);
    if (isPositive && target && target.type === "daily" && target.done) {
      triggerToast("✅ Ya cumpliste esta misión hoy");
      return;
    }

    if (isPositive) {
      launchConfetti();
      const earnedXp = 15;
      const earnedCoins = 10;
      const willLevel = pet.xp + earnedXp >= pet.level * 60;
      const nextStreak = (target?.streak || 0) + 1;
      const milestone = [3, 7, 14, 30].includes(nextStreak);

      if (willLevel) {
        sfx.levelup();
        triggerReaction("good", `🎉 ¡Subí a Nivel ${pet.level + 1}!`);
      } else if (milestone) {
        sfx.levelup();
        triggerReaction("good", `🔥 ¡${nextStreak} días seguidos! +25 🪙`);
      } else {
        sfx.good();
        const cheers = ["¡Excelente elección! 💖", "¡Tus células te lo agradecen! 🌟", "¡Qué buena constancia! 💪", "¡Genial! 🥑", "¡Así se hace! ✨"];
        triggerReaction("good", cheers[Math.floor(Math.random() * cheers.length)]);
      }

      setPet((prev) => {
        let newXp = prev.xp + earnedXp;
        let newLevel = prev.level;
        let xpNeeded = newLevel * 60;
        let newHappiness = Math.min(100, prev.happiness + 6);
        if (newXp >= xpNeeded) {
          newLevel += 1;
          newXp -= xpNeeded;
          triggerToast(`🎉 ¡${prev.name} SUBIÓ AL NIVEL ${newLevel}!`);
        } else {
          triggerToast(`+${earnedXp} XP · +${earnedCoins} Monedas 🪙`);
        }
        return {
          ...prev,
          level: newLevel,
          xp: newXp,
          coins: prev.coins + earnedCoins + (milestone ? 25 : 0),
          totalDone: (prev.totalDone || 0) + 1,
          history: { ...(prev.history || {}), [todayKey()]: ((prev.history || {})[todayKey()] || 0) + 1 },
          happiness: newHappiness
        };
      });

      setHabits((prev) => prev.map((h) => {
        if (h.id === id) {
          const s = (h.streak || 0) + 1;
          return { ...h, streak: s, best: Math.max(h.best || 0, s), lastDone: todayKey(), done: h.type === "daily" ? true : h.done };
        }
        return h;
      }));
    } else {
      sfx.bad();
      setPet((prev) => ({ ...prev, happiness: Math.max(10, prev.happiness - 10) }));
      triggerToast(`💔 La felicidad de ${pet.name} disminuyó un poco.`);
      triggerReaction("bad", "Ay... no pasa nada, ¡mañana elegimos mejor! 🥺");
      setHabits((prev) => prev.map((x) => (x.id === id ? { ...x, streak: 0 } : x)));
    }
  };

  const handleAddCustomTask = () => {
    if (!newTitle.trim()) return;
    setHabits((prev) => [
      ...prev,
      { id: "custom_" + Date.now(), type: newType, title: newTitle.trim(), positive: true, negative: false, streak: 0, done: false }
    ]);
    setNewTitle("");
    sfx.tap();
    triggerToast("✨ Misión añadida con éxito");
  };

  const handleAddFoodAsHabit = (food) => {
    const exists = habits.some((h) => h.title.includes(food.title));
    if (exists) {
      triggerToast("ℹ️ Esta comida ya está en tus misiones");
      return;
    }
    setHabits((prev) => [
      ...prev,
      { id: "food_" + Date.now(), type: "daily", title: `Comer: ${food.title}`, positive: true, negative: false, streak: 0, done: false }
    ]);
    sfx.good();
    triggerToast(`🥑 ¡"${food.title}" sumado a tus hábitos de hoy!`);
    setActiveTab("tasks");
  };

  const handleBuyItem = (item) => {
    if (pet.coins < item.price) {
      sfx.bad();
      triggerToast("❌ Monedas insuficientes");
      return;
    }
    setPet((prev) => ({
      ...prev,
      coins: prev.coins - item.price,
      inventory: [...prev.inventory, item.id],
      equipped: { ...prev.equipped, [item.slot]: item.id }
    }));
    sfx.coin();
    triggerToast(`🛍️ Compraste y equipaste ${item.name}`);
  };

  const handleToggleEquip = (item) => {
    sfx.tap();
    setPet((prev) => {
      const isEquipped = prev.equipped[item.slot] === item.id;
      return {
        ...prev,
        equipped: { ...prev.equipped, [item.slot]: isEquipped ? null : item.id }
      };
    });
  };

  const feedPet = () => {
    if (pet.coins < 8) {
      sfx.bad();
      triggerToast("❌ Necesitás 8 monedas para alimentar a tu mascota");
      return;
    }
    if (pet.happiness >= 100) {
      sfx.tap();
      triggerToast(`😋 ${pet.name} ya está llena de felicidad`);
      return;
    }
    sfx.good();
    triggerReaction("good", "¡Ñam ñam! Manzanita biológica 🍏");
    setPet((p) => ({ ...p, coins: p.coins - 8, happiness: Math.min(100, p.happiness + 15) }));
    triggerToast(`+15% Felicidad para ${pet.name}`);
  };

  // Water target calculation
  const recommendedLiters = useMemo(() => {
    let base = userWeight * 0.035;
    if (userActive === "moderate") base += 0.4;
    if (userActive === "intense") base += 0.8;
    return Math.max(1.5, Math.round(base * 10) / 10);
  }, [userWeight, userActive]);

  const totalGlassesGoal = useMemo(() => Math.round(recommendedLiters / 0.25), [recommendedLiters]);

  const handleToggleGlass = (idx) => {
    sfx.bubble();
    if (idx < glassesDrunk) {
      setGlassesDrunk(idx);
    } else {
      const next = idx + 1;
      setGlassesDrunk(next);
      if (next >= totalGlassesGoal) {
        launchConfetti();
        sfx.levelup();
        triggerReaction("good", "🌊 ¡Meta diaria de agua alcanzada! Células felices 💧");
        setPet((p) => ({ ...p, coins: p.coins + 15, xp: p.xp + 20 }));
        triggerToast("🎉 ¡Meta de hidratación completada! +15 Monedas");
      }
    }
  };

  // Filtered foods
  const filteredFoods = useMemo(() => {
    return HEALTH_FOODS.filter((f) => {
      const matchCat = foodCategory === "all" || f.category === foodCategory;
      const matchSearch = foodSearch.trim() === "" ||

        f.bioExplanation.toLowerCase().includes(foodSearch.toLowerCase()) ||

            { title: "Primeros Pasos Celulares", desc: "Completaste 5 hábitos saludables", unlocked: (pet.totalDone || 0) >= 5, icon: "🌱" },
            { title: "Racha Incombustible", desc: "Mantuviste una racha de 3 días seguidos", unlocked: (pet.visit?.streak || 0) >= 3, icon: "🔥" },
            { title: "Maestro de la Hidratación", desc: "Completaste tu meta diaria de agua", unlocked: glassesDrunk >= totalGlassesGoal, icon: "💧" },
            { title: "Amigo de la Nutrición", desc: "Posees al menos 3 objetos en el armario", unlocked: pet.inventory.length >= 3, icon: "🥑" },
            { title: "Guardián de la Biología", desc: "Alcanza el Nivel 3 con tu mascota", unlocked: pet.level >= 3, icon: "🌟" }
          ].map((m, i) => E("div", {
            key: i,
            className: `p-3.5 rounded-2xl border-2 flex items-center gap-3.5 ${m.unlocked ? "bg-parchment-100 border-forest-800 shadow-sm" : "bg-parchment-300/50 border-parchment-400 opacity-50"}`
          },
            E("span", { className: "text-2xl" }, m.icon),
            E("div", null,
              E("div", { className: "font-bold text-xs text-forest-900" }, m.title),
              E("div", { className: "text-[11px] text-forest-700" }, m.desc)
            )
          ))
        )
      ),

      E("div", { className: "bg-parchment-200 border-2 border-forest-800 p-6 rounded-3xl card-3d space-y-4" },
        E("h3", { className: "font-fredoka font-bold text-forest-900 text-lg flex items-center gap-2" },
          E("span", null, "📊"), "Constancia de Hábitos Semanal"
        ),
        E("div", { className: "flex items-end justify-between h-44 pt-6 px-2 bg-parchment-100 rounded-2xl border border-parchment-400" },
          [6, 5, 4, 3, 2, 1, 0].map((ago) => {
            const dt = new Date();
            dt.setDate(dt.getDate() - ago);
            return {
              d: ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"][dt.getDay()],
              n: (pet.history || {})[todayKey(dt)] || 0
            };
          }).map(({ d, n }) => E("div", {
            key: d,
            className: "flex flex-col items-center gap-2 flex-1"
          },
            E("div", {
              className: "w-7 bg-forest-800 rounded-t-xl transition-all shadow-sm",
              style: { height: `${Math.min(n * 20 + 8, 120)}px` },
              title: `${n} hábitos cumplidos`
            }),
            E("span", { className: "text-[11px] font-bold text-forest-800 font-fredoka" }, d)
          ))
        )
      )
    ),

    // TAB 6: Reminders
    activeTab === "reminders" && E("div", { className: "bg-parchment-200 border-2 border-forest-800 p-6 rounded-3xl card-3d space-y-5" },
      E("h3", { className: "font-fredoka font-bold text-forest-900 text-xl flex items-center gap-2" },
        E("span", null, "🔔"), "Recordatorios Biológicos y de Hidratación"
      ),
      E("p", { className: "text-xs font-semibold text-forest-700" },
        "Te avisamos con campanitas y mensajes cuando llegue la hora de tomar agua, hacer pausas activas o preparar una comida nutritiva."
      ),
      E("div", { className: "flex flex-col sm:flex-row gap-3" },
        E("input", {
          type: "time",
          value: newRTime,
          onChange: (e) => setNewRTime(e.target.value || "09:00"),
          className: "bg-parchment-100 border-2 border-parchment-400 rounded-2xl px-3 py-2 text-sm font-bold text-forest-900"
        }),
        E("input", {
          type: "text",
          value: newRTitle,
          onChange: (e) => setNewRTitle(e.target.value),
          placeholder: "¿Qué querés recordar? (ej: Tomar 1 vaso de agua)",
          className: "flex-1 bg-parchment-100 border-2 border-parchment-400 rounded-2xl px-4 py-2 text-sm font-bold text-forest-900"
        }),
        E("button", {
          onClick: () => {
            if (!newRTitle.trim()) return;
            setReminders((prev) => [...prev, { id: "r" + Date.now(), time: newRTime, title: newRTitle.trim(), active: true }].sort((a, b) => a.time.localeCompare(b.time)));
            setNewRTitle("");
            sfx.tap();
            triggerToast("⏰ Recordatorio guardado");
          },
          className: "bg-forest-800 hover:bg-forest-700 text-parchment-100 font-fredoka font-bold px-6 py-2 rounded-2xl btn-3d transition"
        }, "+ Añadir")
      ),
      E("div", { className: "space-y-3" },
        reminders.map((r) => E("div", {
          key: r.id,
          className: "bg-parchment-100 border-2 border-forest-800 p-4 rounded-2xl flex items-center justify-between gap-3"
        },
          E("div", { className: "flex-1" },
            E("span", { className: "font-fredoka font-bold text-gold text-sm bg-forest-800 px-2.5 py-0.5 rounded-lg" }, r.time),
            E("p", { className: "font-bold text-xs text-forest-900 mt-1.5" }, r.title)
          ),
          E("div", { className: "flex items-center gap-2" },
            E("button", {
              onClick: () => { sfx.chime(); triggerToast(`🔔 Prueba de aviso: ${r.title}`); },
              className: "px-3 py-1.5 rounded-xl text-sm bg-parchment-300 hover:bg-parchment-400"
            }, "🔊 Probar"),
            E("button", {
              onClick: () => setReminders((prev) => prev.filter((x) => x.id !== r.id)),
              className: "px-3 py-1.5 rounded-xl text-xs font-bold bg-terracotta text-white"
            }, "🗑")
          )
        ))
      )
    ),

    // TAB 7: About the Project (QUIÉNES SOMOS & BIOLOGÍA - ETEC UM)
    activeTab === "about" && E("div", { className: "space-y-6" },
      // Institutional Banner
      E("div", { className: "bg-forest-900 text-parchment-100 border-2 border-gold p-6 sm:p-8 rounded-3xl card-3d space-y-4 relative overflow-hidden" },
        E("div", { className: "flex flex-col md:flex-row justify-between items-start md:items-center gap-4" },
          E("div", null,
            E("div", { className: "inline-block bg-gold text-forest-950 font-fredoka font-bold text-xs px-3 py-1 rounded-full mb-2 uppercase tracking-wider" },
              "Escuela Técnica de la Universidad de Mendoza (ETec)"
            ),
            E("h2", { className: "font-fredoka text-3xl font-bold text-parchment-100 leading-tight" },
              "Ruta de Hábitos: Compañeros de Bienestar RPG"
            ),
            E("p", { className: "text-sage-light text-sm font-semibold mt-1" },
              "Proyecto Interdisciplinario · 3° Año Especialidad Informática · Cátedra de Biología (2026)"
            )
          ),
          E("div", { className: "bg-forest-800/90 border border-forest-600 p-4 rounded-2xl text-center min-w-[170px]" },
            E("span", { className: "text-3xl" }, "🧬"),
            E("div", { className: "font-fredoka text-gold font-bold text-sm mt-1" }, "ETec UM"),
            E("div", { className: "text-[11px] text-parchment-300" }, "Mendoza, Argentina")
          )
        ),
        E("p", { className: "text-xs sm:text-sm text-parchment-200 leading-relaxed pt-2 border-t border-forest-700" },
          "Este proyecto nace en nuestra clase de ", E("strong", null, "Biología"), " con el propósito de integrar la ",
          E("strong", null, "programación y la ciencia biológica"), ". Diseñamos una aplicación interactiva que aplica la neurobiología de la dopamina, la nutrición celular, los ritmos circadianos y la homeostasis para transformar el cuidado personal diario en una experiencia lúdica, accesible y científicamente fundamentada."
        )
      ),

      // Group Members Cards (Las 5 Estudiantes)
      E("div", { className: "space-y-3" },
        E("h3", { className: "font-fredoka font-bold text-parchment-100 text-xl flex items-center gap-2" },
          E("span", null, "👥"), "Equipo de Desarrollo e Investigación (Grupo de Trabajo)"
        ),
        E("div", { className: "grid sm:grid-cols-2 lg:grid-cols-3 gap-4" },
          GROUP_MEMBERS.map((member, idx) => E("div", {
            key: idx,
            className: "bg-parchment-100 border-2 border-forest-800 p-5 rounded-3xl card-3d flex flex-col justify-between space-y-3 hover:translate-y-[-2px] transition"
          },
            E("div", { className: "space-y-2.5" },
              E("div", { className: "flex items-center gap-3" },
                E("span", { className: "text-3xl p-2 bg-parchment-200 rounded-2xl border border-parchment-400" }, member.avatar),
                E("div", null,
                  E("h4", { className: "font-fredoka text-lg font-bold text-forest-900 leading-tight" }, member.name),
                  E("span", { className: "text-[10px] font-bold text-terracotta bg-terracotta/10 px-2 py-0.5 rounded-md" }, member.badge)
                )
              ),
              E("div", { className: "text-xs font-bold text-forest-700" },
                "🎓 3er Año Informática · ETec UM"
              ),
              E("div", { className: "text-xs text-forest-800 font-semibold" },
                E("span", { className: "font-bold text-forest-950" }, "Área de Enfoque: "), member.focus
              ),
              E("p", { className: "text-[11px] text-forest-700 leading-relaxed bg-parchment-200/60 p-2.5 rounded-xl border border-parchment-300" },
                member.desc
              )
            )
          ))
        )
      ),

      // Biology Theoretical Pillars
      E("div", { className: "bg-parchment-200 border-2 border-forest-800 p-6 rounded-3xl card-3d space-y-4" },
        E("h3", { className: "font-fredoka font-bold text-forest-900 text-xl flex items-center gap-2" },
          E("span", null, "🔬"), "Fundamentación Científica y Biológica de la Aplicación"
        ),
        E("p", { className: "text-xs text-forest-700 font-semibold" },
          "¿Por qué gamificar hábitos saludables? Nuestra propuesta se basa en 4 pilares fisiológicos demostrados:"
        ),
        E("div", { className: "grid md:grid-cols-2 gap-4" },
          BIOLOGY_PILLARS.map((pillar, i) => E("div", {
            key: i,
            className: `p-4 rounded-2xl border-2 ${pillar.color} shadow-sm space-y-2`
          },
            E("div", { className: "flex items-center gap-2 font-fredoka font-bold text-forest-900 text-sm" },
              E("span", { className: "text-xl" }, pillar.icon),
              E("span", null, pillar.title)
            ),
            E("p", { className: "text-xs text-forest-800 leading-relaxed" }, pillar.summary)
          ))
        )
      ),

      // Open Scientific References
      E("div", { className: "bg-forest-800 text-parchment-100 border-2 border-forest-600 p-6 rounded-3xl card-3d space-y-3" },
        E("h4", { className: "font-fredoka font-bold text-gold text-base" }, "📚 Fuentes y Bibliografía Científica Abierta"),
        E("ul", { className: "text-xs space-y-2 text-parchment-200 font-semibold" },
          E("li", null,
            "• ", E("a", { href: "https://www.who.int/es/news-room/fact-sheets/detail/healthy-diet", target: "_blank", rel: "noopener", className: "underline text-gold hover:text-gold-light" }, "Organización Mundial de la Salud (OMS) — Alimentación Sana y Micronutrientes.")
          ),
          E("li", null,
            "• ", E("a", { href: "https://www.hsph.harvard.edu/nutritionsource/healthy-eating-plate/plate-spanish/", target: "_blank", rel: "noopener", className: "underline text-gold hover:text-gold-light" }, "Harvard T.H. Chan School of Public Health — El Plato para Comer Saludable.")
          ),
          E("li", null,
            "• ", E("a", { href: "https://www.sleepfoundation.org/nutrition", target: "_blank", rel: "noopener", className: "underline text-gold hover:text-gold-light" }, "Sleep Foundation — Fisiología del Sueño, Melatonina y Ritmos Circadianos.")
          ),
          E("li", null,
            "• ", E("a", { href: "https://fundaciondelcorazon.com/", target: "_blank", rel: "noopener", className: "underline text-gold hover:text-gold-light" }, "Fundación Española del Corazón — Nutrición celular y salud cardiovascular.")
          )
        )
      )
    ),

    // Floating Controls
    E(React.Fragment, null,
      E("button", {
        onClick: feedPet,
        title: "Dar manzana nutritiva (8 monedas)",
        className: "fixed bottom-24 right-4 z-40 w-13 h-13 rounded-full bg-forest-800 border-2 border-gold text-2xl btn-3d flex items-center justify-center p-2.5 shadow-2xl"
      }, "🍏"),
      E("button", {
        onClick: toggleSound,
        title: soundOn ? "Silenciar sonidos" : "Activar sonidos",
        className: "fixed bottom-6 right-4 z-40 w-13 h-13 rounded-full bg-forest-800 border-2 border-gold text-2xl btn-3d flex items-center justify-center p-2.5 shadow-2xl"
      }, soundOn ? "🔊" : "🔇")
    ),

    // Toast message
    toastMessage && E("div", {
      className: "fixed bottom-6 left-1/2 -translate-x-1/2 bg-forest-950 text-gold px-6 py-3 rounded-2xl font-fredoka font-bold border-2 border-gold shadow-2xl z-50 animate-bounce text-sm text-center"
    }, toastMessage)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(E(App));
</script>
</body>
</html>
