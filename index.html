/* ============================================================================
   1. UTILIDADES DE FECHA Y ALMACENAMIENTO LOCAL
   ============================================================================ */
function todayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function getPastDays(count = 7) {
  const days = [];
  const names = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  for (let i = count - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push({
      key: todayKey(d),
      label: i === 0 ? "Hoy" : names[d.getDay()],
      dayNum: d.getDate()
    });
  }
  return days;
}

function dayDiff(a, b) {
  if (!a || !b) return 0;
  const p = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  };
  return Math.round((p(b) - p(a)) / 864e5);
}

function lsRaw(k) {
  try { return window.localStorage.getItem(k); } catch (e) { return null; }
}

function lsJSON(k, fallback) {
  try {
    const raw = window.localStorage.getItem(k);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}

function lsSet(k, v) {
  try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

function refreshDays(habits) {
  const today = todayKey();
  let changed = false;
  const out = habits.map((h) => {
    let n = h;
    if (h.streak && (!h.lastDone || dayDiff(h.lastDone, today) >= 2)) {
      n = { ...n, streak: 0 };
    }
    if ((h.type === "daily" || h.type === "school") && h.done && h.lastDone !== today) {
      n = { ...n, done: false };
    }
    if (n !== h) changed = true;
    return n;
  });
  return changed ? out : habits;
}

function refreshVisit(pet) {
  const today = todayKey();
  const v = pet.visit || { last: null, streak: 0, best: 0 };
  if (v.last === today) return pet;
  const streak = v.last && dayDiff(v.last, today) === 1 ? v.streak + 1 : 1;
  const gap = v.last ? dayDiff(v.last, today) : 0;
  const hp = gap > 1 ? Math.max(15, (pet.happiness ?? 85) - 6 * (gap - 1)) : pet.happiness;
  return {
    ...pet,
    happiness: hp,
    visit: { last: today, streak, best: Math.max(v.best || 0, streak) }
  };
}

/* ============================================================================
   4. SINTETIZADOR DE SONIDO (WEB AUDIO API - SIN ARCHIVOS EXTERNOS)
   ============================================================================ */
const sfx = (() => {
  let ctx = null;
  const api = { enabled: lsRaw("ruta_habitos_sound") !== "false" };
  function C() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function note(f, t0, d, type, v, f2) {
    const c = C(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + t0;
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.05);
  }
  function seq(list) { if (!api.enabled) return; try { list.forEach((n) => note(...n)); } catch (e) {} }
  api.good = () => seq([[523,0,.14,"triangle",.18],[659,.09,.14,"triangle",.18],[784,.18,.14,"triangle",.18],[1047,.27,.35,"triangle",.2]]);
  api.bad = () => seq([[330,0,.22,"sawtooth",.07],[277,.17,.22,"sawtooth",.07],[220,.34,.5,"sawtooth",.07,170]]);
  api.coin = () => seq([[988,0,.08,"square",.06],[1319,.08,.3,"square",.06]]);
  api.levelup = () => seq([[523,0,.12,"triangle",.2],[659,.1,.12,"triangle",.2],[784,.2,.12,"triangle",.2],[1047,.3,.12,"triangle",.2],[784,.42,.1,"triangle",.2],[1047,.5,.12,"triangle",.2],[1319,.6,.6,"triangle",.24]]);
  api.tap = () => seq([[500,0,.12,"sine",.15,900]]);
  api.chime = () => seq([[880,0,.25,"sine",.2],[1109,.2,.25,"sine",.2],[1319,.4,.5,"sine",.2],[880,1.1,.25,"sine",.2],[1109,1.3,.25,"sine",.2],[1319,1.5,.6,"sine",.2]]);
  ["pointerdown", "keydown"].forEach((ev) => window.addEventListener(ev, () => { C(); }, { once: true }));
  return api;
})();

function FocusAndBreathingWidget({ onCompleteSession }) {
  const [mode, setMode] = useState("study"); // study | stretch | breathe
  const [secondsLeft, setSecondsLeft] = useState(25 * 60);
  const [running, setRunning] = useState(false);

  const presets = {
    study: { label: "📚 Estudio 25m", secs: 25 * 60, rewardXp: 25, rewardCoins: 15, desc: "Técnica Pomodoro: 25 min de enfoque total sin mirar el celular." },
    stretch: { label: "🧘 Pausa Activa 5m", secs: 5 * 60, rewardXp: 15, rewardCoins: 8, desc: "Ponte de pie, estira cuello, hombros, espalda y descansa tus ojos." },
    breathe: { label: "🌬️ Calma 4-7-8 (2m)", secs: 2 * 60, rewardXp: 15, rewardCoins: 8, desc: "Inhala 4s, mantén 7s, exhala 8s. Ideal antes de un examen." }
  };

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      setSecondsLeft((prev) => {
        if (prev <= 1) {
          setRunning(false);
          sfx.chime();
          onCompleteSession(presets[mode]);
          return presets[mode].secs;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running, mode]);

  const selectMode = (m) => {
    setRunning(false);
    setMode(m);
    setSecondsLeft(presets[m].secs);
  };

  const mins = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
  const secs = String(secondsLeft % 60).padStart(2, "0");

  return E("div", { className: "bg-parchment-200 border-4 border-forest-900 rounded-3xl p-4 card-3d" },
    E("div", { className: "flex items-center justify-between mb-2" },
      E("h3", { className: "font-fredoka font-bold text-forest-900 text-base flex items-center gap-1.5" }, "⏱️ Zona de Enfoque y Pausa Activa"),
      E("span", { className: "text-xs font-bold text-sage-dark bg-sage/20 px-2 py-0.5 rounded-lg" }, `+${presets[mode].rewardXp} XP`)
    ),
    E("div", { className: "grid grid-cols-3 gap-1.5 mb-3" },
      Object.entries(presets).map(([k, item]) => E("button", {
        key: k,
        onClick: () => selectMode(k),
        className: `py-1.5 px-2 rounded-xl text-xs font-bold font-fredoka border-2 transition-all ${mode === k ? "bg-forest-800 text-parchment-100 border-forest-900" : "bg-parchment-100 text-forest-800 border-parchment-400 hover:bg-parchment-300"}`
      }, item.label))
    ),
    mode === "breathe" && E("div", { className: "my-2 py-3 bg-forest-800 rounded-2xl flex flex-col items-center justify-center text-parchment-100" },
      E("div", { className: "w-16 h-16 rounded-full bg-sage/40 border-4 border-gold flex items-center justify-center animate-breathe mb-1.5" },
        E("span", { className: "text-xl" }, "🌿")
      ),
      E("p", { className: "text-xs font-fredoka text-gold-light" }, "Inhala 4s • Mantén 7s • Exhala lento 8s")
    ),
    E("div", { className: "flex items-center justify-between bg-parchment-100 border-2 border-parchment-400 rounded-2xl p-3 mb-2" },
      E("div", null,
        E("div", { className: "font-fredoka font-bold text-2xl text-forest-900 tracking-wider" }, `${mins}:${secs}`),
        E("p", { className: "text-[11px] text-forest-600 leading-tight max-w-[200px]" }, presets[mode].desc)
      ),
      E("div", { className: "flex flex-col gap-1.5" },
        E("button", {
          onClick: () => setRunning(!running),
          className: `px-4 py-2 rounded-xl font-fredoka font-bold text-xs text-white btn-3d ${running ? "bg-terracotta" : "bg-sage-dark"}`
        }, running ? "⏸ Pausar" : "▶ Iniciar"),
        E("button", {
          onClick: () => { setRunning(false); setSecondsLeft(presets[mode].secs); },
          className: "px-3 py-1 rounded-lg bg-parchment-300 text-forest-800 font-bold text-[11px]"
        }, "Reiniciar")
      )
    )
  );
}

function HealthAcademyTab({ onQuizWin, quizPassed }) {
  const [selectedPillar, setSelectedPillar] = useState(HEALTH_PILLARS[0].id);
  const [showQuiz, setShowQuiz] = useState(false);
  const [qIndex, setQIndex] = useState(0);
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [score, setScore] = useState(0);
  const [quizFinished, setQuizFinished] = useState(false);

  // Calculadora rápida de agua escolar
  const [weightKg, setWeightKg] = useState(55);
  const [activeSport, setActiveSport] = useState(false);
  const recommendedLiters = ((weightKg * 0.035) + (activeSport ? 0.5 : 0)).toFixed(1);
  const recommendedGlasses = Math.max(5, Math.round(Number(recommendedLiters) * 4));

  const pillar = HEALTH_PILLARS.find((p) => p.id === selectedPillar) || HEALTH_PILLARS[0];

  const handleAnswer = (idx) => {
    if (selectedOpt !== null) return;
    setSelectedOpt(idx);
    if (idx === QUIZ_QUESTIONS[qIndex].correct) {
      setScore((s) => s + 1);
      sfx.good();
    } else {
      sfx.bad();
    }
  };

  const nextQuestion = () => {
    if (qIndex + 1 < QUIZ_QUESTIONS.length) {
      setQIndex((i) => i + 1);
      setSelectedOpt(null);
    } else {
      setQuizFinished(true);
      if (score >= 4) {
        onQuizWin(score);
      }
    }
  };

  const restartQuiz = () => {
    setQIndex(0);
    setSelectedOpt(null);
    setScore(0);
    setQuizFinished(false);
  };

  return E("div", { className: "space-y-6" },
    /* BANNER PRINCIPAL EDUCATIVO */
    E("div", { className: "bg-gradient-to-r from-forest-700 via-forest-600 to-forest-700 border-4 border-gold rounded-3xl p-5 sm:p-6 text-parchment-100 card-3d flex flex-col md:flex-row items-center justify-between gap-4" },
      E("div", { className: "space-y-2 max-w-2xl" },
        E("span", { className: "inline-block px-3 py-1 rounded-full bg-gold text-forest-900 font-fredoka font-bold text-xs uppercase tracking-wider" }, "📚 Guía Científica para Estudiantes y Docentes"),
        E("h2", { className: "font-fredoka font-bold text-2xl sm:text-3xl text-parchment-100" }, "Academia de Hábitos Saludables"),
        E("p", { className: "text-sm sm:text-base text-parchment-200 leading-relaxed" },
          "Descubre cómo funcionan tu cerebro y tu cuerpo en la escuela. Explora los 6 pilares del bienestar y pon a prueba lo aprendido en el Desafío del Sabio para ganar recompensas."
        )
      ),
      E("button", {
        onClick: () => { setShowQuiz(!showQuiz); restartQuiz(); },
        className: "w-full md:w-auto px-5 py-3.5 rounded-2xl bg-gold hover:bg-gold-hover text-forest-900 font-fredoka font-bold text-sm sm:text-base btn-3d-gold shrink-0 flex items-center justify-center gap-2"

    showQuiz ? E("div", { className: "bg-parchment-200 border-4 border-forest-900 rounded-3xl p-5 sm:p-8 card-3d max-w-3xl mx-auto" },

  return E("div", { className: "space-y-6" },

        pastDays.map((d) => {

      E("h3", { className: "font-fredoka font-bold text-xl text-forest-900 mb-1" }, "🏅 Medallas y Logros Desbloqueables"),
      E("p", { className: "text-xs text-forest-600 font-semibold mb-4" }, "Completa hábitos, hidrátate y aprueba el quiz para coleccionar todas."),
      E("div", { className: "grid grid-cols-2 sm:grid-cols-4 gap-3" },

          E("span", { className: "font-fredoka font-bold text-sm text-gold mt-1" }, `${pet.name} • Nvl ${pet.level}`)

/* ============================================================================
   9. APLICACIÓN PRINCIPAL
   ============================================================================ */
function App() {
  const defaultPet = {
    name: "Broti",
    species: "dragon",
    colorId: "emerald",
    personality: "alegre",
    pose: "happy",
    level: 1,
    xp: 20,
    hp: 90,
    happiness: 85,
    coins: 65,
    owned: ["lucky_flower", "water_bottle"],
    equipped: { head: "lucky_flower", body: null, hand: "water_bottle", aura: null, pet: null },
    visit: { last: todayKey(), streak: 1, best: 1 }
  };

  const defaultHabits = [
    { id: "h1", title: "Tomar 2 Litros de Agua en el día", type: "daily", positive: true, negative: false, difficulty: "medium", streak: 2, done: false, lastDone: null, category: "💧 Hidratación" },
    { id: "h2", title: "Desayunar saludable antes de clase", type: "school", positive: true, negative: false, difficulty: "medium", streak: 1, done: false, lastDone: null, category: "🥗 Nutrición" },
    { id: "h3", title: "Mantener buena postura en el pupitre", type: "habit", positive: true, negative: true, difficulty: "easy", streak: 3, done: false, lastDone: null, category: "🪑 Ergonomía" },
    { id: "h4", title: "Dormir 8 horas sin pantallas antes", type: "daily", positive: true, negative: false, difficulty: "hard", streak: 1, done: false, lastDone: null, category: "🌙 Sueño" }
  ];

  const [onboarded, setOnboarded] = useState(() => lsRaw("ruta_habitos_onboarded") === "true");
  const [studentName, setStudentName] = useState(() => lsRaw("ruta_habitos_student") || "Explorador/a");
  const [pet, setPet] = useState(() => refreshVisit(lsJSON("ruta_habitos_pet_v2", defaultPet)));
  const [habits, setHabits] = useState(() => refreshDays(lsJSON("ruta_habitos_list_v2", defaultHabits)));
  const [waterData, setWaterData] = useState(() => {
    const saved = lsJSON("ruta_habitos_water", { date: todayKey(), count: 2, maxEver: 2 });
    return saved.date === todayKey() ? saved : { date: todayKey(), count: 0, maxEver: saved.maxEver || 0 };
  });
  const [historyMap, setHistoryMap] = useState(() => lsJSON("ruta_habitos_history", { [todayKey()]: 1 }));
  const [totalCompleted, setTotalCompleted] = useState(() => Number(lsRaw("ruta_habitos_total") || 4));
  const [quizPassed, setQuizPassed] = useState(() => lsRaw("ruta_habitos_quiz_passed") === "true");

  const [activeTab, setActiveTab] = useState("habits"); // habits | academy | customize | shop | progress
  const [reaction, setReaction] = useState(null);
  const [toast, setToast] = useState(null);
  const [soundOn, setSoundOn] = useState(sfx.enabled);

  // Formulario nuevo hábito
  const [newTitle, setNewTitle] = useState("");
  const [newType, setNewType] = useState("daily");
  const [newDiff, setNewDiff] = useState("medium");
  const [newNeg, setNewNeg] = useState(false);
  const [showPresets, setShowPresets] = useState(false);

  // Persistencia automática
  useEffect(() => { lsSet("ruta_habitos_pet_v2", pet); }, [pet]);
  useEffect(() => { lsSet("ruta_habitos_list_v2", habits); }, [habits]);
  useEffect(() => { lsSet("ruta_habitos_water", waterData); }, [waterData]);
  useEffect(() => { lsSet("ruta_habitos_history", historyMap); }, [historyMap]);
  useEffect(() => { lsSet("ruta_habitos_total", totalCompleted); }, [totalCompleted]);
  useEffect(() => { lsSet("ruta_habitos_student", studentName); }, [studentName]);

  const showToast = (msg, tone = "good") => {
    setToast({ id: Date.now(), msg, tone });
    setTimeout(() => setToast((t) => (t && Date.now() - t.id >= 2900 ? null : t)), 3000);
  };

  const triggerReaction = (type, msg) => {
    const id = Date.now() + Math.random();
    setReaction({ id, type, msg });
    setTimeout(() => setReaction((r) => (r && r.id === id ? null : r)), 2400);
  };

  const fireConfetti = () => {
    if (typeof window.confetti === "function") {
      window.confetti({ particleCount: 55, spread: 65, origin: { y: 0.65 } });
    }
  };

  const grantRewards = (xpGain, coinGain, hpGain = 4, happyGain = 6) => {
    setPet((prev) => {
      const xpNeeded = prev.level * 100;
      let nextXp = prev.xp + xpGain;
      let nextLevel = prev.level;
      let leveled = false;
      while (nextXp >= nextLevel * 100) {
        nextXp -= nextLevel * 100;
        nextLevel += 1;
        leveled = true;
      }
      if (leveled) {
        setTimeout(() => {
          sfx.levelup();
          fireConfetti();
          showToast(`🎉 ¡${prev.name} subió al Nivel ${nextLevel}!`, "gold");
        }, 250);
      }
      return {
        ...prev,
        level: nextLevel,
        xp: nextXp,
        coins: prev.coins + coinGain,
        hp: Math.min(100, Math.max(0, prev.hp + hpGain)),
        happiness: Math.min(100, Math.max(0, prev.happiness + happyGain))
      };
    });
  };

  const recordActivityToday = () => {
    const t = todayKey();
    setHistoryMap((prev) => ({ ...prev, [t]: (prev[t] || 0) + 1 }));
    setTotalCompleted((c) => c + 1);
  };

  const handleHabitAction = (habit, isPositive = true) => {
    const diffMult = habit.difficulty === "hard" ? 2 : habit.difficulty === "medium" ? 1.4 : 1;
    if (isPositive) {
      if ((habit.type === "daily" || habit.type === "school") && habit.done) return;
      const xpGain = Math.round(12 * diffMult);
      const coinGain = Math.round(7 * diffMult);
      sfx.good();
      grantRewards(xpGain, coinGain, 5, 7);
      recordActivityToday();
      triggerReaction("good", `¡Genial! +${xpGain} XP y +${coinGain} 🪙`);
      setHabits((prev) => prev.map((h) => h.id === habit.id ? {
        ...h,
        done: h.type === "habit" ? false : true,
        streak: (h.streak || 0) + 1,
        lastDone: todayKey()
      } : h));
      if ((habit.streak || 0) + 1 === 5) fireConfetti();
    } else {
      sfx.bad();
      triggerReaction("bad", "¡Ánimo! Retomemos el buen camino 💪");
      setPet((prev) => ({
        ...prev,
        hp: Math.max(10, prev.hp - 10),
        happiness: Math.max(10, prev.happiness - 12)
      }));
      setHabits((prev) => prev.map((h) => h.id === habit.id ? { ...h, streak: 0 } : h));
    }
  };

  const addHabit = (e) => {
    e.preventDefault();
    if (!newTitle.trim()) return;
    const item = {
      id: "hab_" + Date.now(),
      title: newTitle.trim(),
      type: newType,
      positive: true,
      negative: newNeg,
      difficulty: newDiff,
      streak: 0,
      done: false,
      lastDone: null,
      category: newType === "school" ? "🏫 Escolar" : "🌿 Personal"
    };
    setHabits((prev) => [item, ...prev]);
    setNewTitle("");
    sfx.tap();
    showToast("✅ Nuevo hábito agregado a tu ruta");
  };

  const addPresetHabit = (preset) => {
    if (habits.some((h) => h.title === preset.title)) {
      showToast("Ya tienes este hábito en tu lista", "warn");
      return;
    }
    setHabits((prev) => [{
      id: "pre_" + Date.now() + Math.random(),
      title: preset.title,
      type: preset.type || "daily",
      positive: true,
      negative: !!preset.negative,
      difficulty: preset.difficulty || "medium",
      streak: 0,
      done: false,
      lastDone: null,
      category: preset.category
    }, ...prev]);
    sfx.good();
    showToast(`➕ Agregado: ${preset.title}`);
  };

  const deleteHabit = (id) => {
    setHabits((prev) => prev.filter((h) => h.id !== id));
    sfx.tap();
  };

  const handleAddWater = () => {
    setWaterData((prev) => {
      const nextCount = Math.min(12, prev.count + 1);
      const nextMax = Math.max(prev.maxEver || 0, nextCount);
      if (nextCount === 8) {
        fireConfetti();
        showToast("💧 ¡Meta diaria de 2 Litros cumplida! +15 🪙 extra");
        grantRewards(15, 15, 8, 10);
      } else {
        grantRewards(5, 3, 2, 3);
        triggerReaction("good", "¡Hidratación +1 vaso! 💧");
      }
      sfx.good();
      recordActivityToday();
      return { date: todayKey(), count: nextCount, maxEver: nextMax };
    });
  };

  const handleBuyOrEquip = (item) => {
    const owned = pet.owned.includes(item.id);
    const isEquipped = pet.equipped[item.slot] === item.id;
    if (owned) {
      setPet((prev) => ({
        ...prev,
        equipped: { ...prev.equipped, [item.slot]: isEquipped ? null : item.id }
      }));
      sfx.tap();
      showToast(isEquipped ? `Guardaste: ${item.name}` : `Equipaste: ${item.name}`);
      return;
    }
    if (pet.coins < item.price) {
      sfx.bad();
      showToast("Necesitas más monedas. ¡Cumple hábitos o juega el Quiz!", "warn");
      return;
    }
    sfx.coin();
    fireConfetti();
    setPet((prev) => ({
      ...prev,
      coins: prev.coins - item.price,
      owned: [...prev.owned, item.id],
      equipped: { ...prev.equipped, [item.slot]: item.id }
    }));
    triggerReaction("good", `¡Qué estilo! ${item.icon}`);
    showToast(`🛍️ ¡Compraste y equipaste ${item.name}!`);
  };

  const handleCarePet = (care) => {
    if (pet.coins < care.cost) {
      sfx.bad();
      showToast("No tienes suficientes monedas", "warn");
      return;
    }
    sfx.good();
    setPet((prev) => ({
      ...prev,
      coins: prev.coins - care.cost,
      hp: Math.min(100, prev.hp + care.hp),
      happiness: Math.min(100, prev.happiness + care.happy)
    }));
    grantRewards(care.xp, 0, 0, 0);
    triggerReaction("good", `¡Mmm! ${care.icon} (+${care.happy} Felicidad)`);
  };

  const handleCopySummary = (text) => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      sfx.coin();
      showToast("📋 ¡Reporte copiado al portapapeles! Listo para pegar y compartir");
    } catch (e) {
      showToast("No se pudo copiar automáticamente", "warn");
    }
  };

  const statsSummary = {
    totalCompleted,
    maxWater: Math.max(waterData.maxEver || 0, waterData.count),
    waterToday: waterData.count,
    bestStreak: Math.max(pet.visit?.best || 1, ...habits.map((h) => h.streak || 0)),
    quizPassed,
    ownedCount: pet.owned.length,
    level: pet.level
  };

  /* PANTALLA DE BIENVENIDA / ONBOARDING INICIAL */
  if (!onboarded) {
    return E("div", { className: "min-h-screen flex items-center justify-center p-4" },
      E("div", { className: "bg-parchment-200 border-4 border-forest-900 rounded-3xl p-6 sm:p-8 max-w-xl w-full card-3d space-y-5" },
        E("div", { className: "text-center space-y-1" },
          E("span", { className: "inline-block px-3 py-1 rounded-full bg-forest-800 text-gold font-fredoka font-bold text-xs uppercase" }, "🌿 Proyecto Escolar de Bienestar"),

          E("label", { className: "sm:col-span-1 flex items-center justify-center gap-1 bg-parchment-100 border-2 border-parchment-400 rounded-xl px-2 text-xs font-bold text-forest-900 cursor-pointer", title: "Incluir botón de recaída (-)" },

          )

    ),

    activeTab === "academy" && E(HealthAcademyTab, {
      quizPassed,
      onQuizWin: () => {
        if (!quizPassed) {
          setQuizPassed(true);
          lsSet("ruta_habitos_quiz_passed", true);
        }
        grantRewards(50, 40, 15, 20);
        fireConfetti();
        triggerReaction("good", "¡Erudito Saludable! +40 🪙");
      }
    }),

    activeTab === "shop" && E("section", { className: "bg-parchment-200 border-4 border-forest-900 rounded-3xl p-5 sm:p-6 card-3d space-y-5" },
      E("div", { className: "flex flex-wrap items-center justify-between gap-2 border-b-2 border-parchment-400 pb-3" },
        E("div", null,
          E("h3", { className: "font-fredoka font-bold text-xl text-forest-900" }, "🛍️ Tienda del Bosque Místico"),

      ),
      E("div", { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5" },
        EQUIPMENT_CATALOGUE.map((item) => {

          const equipped = pet.equipped[item.slot] === item.id;
          return E("div", {
            key: item.id,
            className: `p-4 rounded-2xl border-2 flex flex-col justify-between gap-3 ${equipped ? "bg-emerald-50 border-sage-dark" : "bg-parchment-100 border-parchment-400"}`

        E("div", null,
          E("label", { className: "block text-xs font-bold text-forest-900 mb-2" }, "Paleta de Color"),
          E("div", { className: "flex flex-wrap gap-2.5" },
            COLOR_PALETTES.map((c) => E("button", {
              key: c.id,
              onClick: () => setPet({ ...pet, colorId: c.id }),
              className: `px-3 py-2 rounded-xl border-2 text-xs font-bold flex items-center gap-2 ${pet.colorId === c.id ? "border-forest-900 bg-parchment-100 shadow" : "border-parchment-400 bg-parchment-100/60"}`
            },
              E("span", { className: "w-4 h-4 rounded-full", style: { backgroundColor: c.primary } }),
              c.name
            ))
          )
        ),
        E("div", null,
          E("label", { className: "block text-xs font-bold text-forest-900 mb-2" }, "Personalidad"),
          E("div", { className: "flex flex-wrap gap-2" },
            Object.values(PERSONALITIES).map((pers) => E("button", {
              key: pers.id,
              onClick: () => setPet({ ...pet, personality: pers.id }),
              className: `px-3 py-2 rounded-xl border-2 text-xs font-bold ${pet.personality === pers.id ? "bg-forest-800 text-parchment-100 border-forest-900" : "bg-parchment-100 border-parchment-400 text-forest-900"}`
            }, `${pers.icon} ${pers.name}`))
          )
        ),
        E("div", null,
          E("label", { className: "block text-xs font-bold text-forest-900 mb-2" }, "Expresión / Pose"),
          E("div", { className: "flex flex-wrap gap-2" },
            Object.values(POSES).map((po) => E("button", {
              key: po.id,
              onClick: () => setPet({ ...pet, pose: po.id }),
              className: `px-3 py-2 rounded-xl border-2 text-xs font-bold ${pet.pose === po.id ? "bg-forest-800 text-parchment-100 border-forest-900" : "bg-parchment-100 border-parchment-400 text-forest-900"}`
            }, `${po.icon} ${po.name}`))
          )
        )
      )
    ),

    activeTab === "progress" && E(ProgressAndShareTab, {
      studentName,
      pet,
      habits,
      historyMap,
      stats: statsSummary,
      onCopySummary: handleCopySummary
    }),

    /* PIE DE PÁGINA ESCOLAR */
    E("footer", { className: "text-center text-xs text-parchment-300/80 pt-2" },
      "🌿 Ruta de Hábitos: Compañeros • Recurso Educativo Interactivo de Promoción de la Salud Escolar"
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(E(App));
</script>
</body>
</html>
